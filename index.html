</script>
<script>window.VAULT_CARDS = [{"id": "5623b42d2d", "t": "bez", "q": "Spaced Repetition plugin format: `question", "a": "answer`, one card per line. Covers G01–G10, rewritten 2026-10-07 to match the corrected notes. Numbers are the verified ones from G11.", "src": "Flashcards"}, {"id": "b3b1eff58c", "t": "org", "q": "GRK grading: when are you exempt from the exam?", "a": "Test 1 + Test 2 (15 each) ≥ 21 with passed labs: ≥ 26 → 4.5, 21–25 → 4.0.", "src": "Flashcards"}, {"id": "5212199aa8", "t": "org", "q": "GRK exam thresholds (test1 + test2 + exam1)?", "a": "> 90 = 5, > 80 = 4.5, > 70 = 4, > 60 = 3.5, > 50 = 3.", "src": "Flashcards"}, {"id": "f1eb4a9832", "t": "org", "q": "Lab grading in GRK?", "a": "7 topics graded 2–5, final = average; each task uploaded to Teams and defended; plagiarism → 0.", "src": "Flashcards"}, {"id": "97fce7c130", "t": "dev", "q": "Data-rate formula?", "a": "pixels per frame × bytes per pixel × frames per second.", "src": "Flashcards"}, {"id": "8cc93333a5", "t": "col", "q": "4K @60 Hz data rate (lecture's way)?", "a": "10,000,000 pixel-clock ticks × 3 B × 60 = 1.8·10⁹ B/s (≈ 1.7 GiB/s).", "src": "Flashcards"}, {"id": "d146cfb107", "t": "img", "q": "Time per pixel, 1920×1080 @80 Hz?", "a": "1 / (2,073,600 × 80) ≈ 6.03 ns.", "src": "Flashcards"}, {"id": "7c788405bb", "t": "fill", "q": "Vector memory: circle, triangle, rectangle, cube (float = 4 B)?", "a": "12 B, 24 B, 32 B, 96 B.", "src": "Flashcards"}, {"id": "556633992d", "t": "clip", "q": "Graphics pipeline stages?", "a": "Vertex shader → primitive assembly → clipping/culling → rasterization → fragment shader → depth test & blending → frame buffer.", "src": "Flashcards"}, {"id": "c359c74c16", "t": "dev", "q": "Fragment shader input and output?", "a": "In: interpolated vertex data (colour, UV, normal, position) + uniforms (textures, lights). Out: fragment colour (+ depth).", "src": "Flashcards"}, {"id": "f64d6f17d2", "t": "dev", "q": "Why GPUs suit graphics?", "a": "SIMD: many ALUs run the same shader on different pixels or vertices at once.", "src": "Flashcards"}, {"id": "7e8fbf55ac", "t": "dev", "q": "Double buffering (ping-pong)?", "a": "Show buffer A while drawing into buffer B, then swap, so you never see a half-drawn frame.", "src": "Flashcards"}, {"id": "be6c430135", "t": "col", "q": "Cross product (1,0,0) × (0,1,0)?", "a": "(0,0,1): x × y = z in a right-handed system.", "src": "Flashcards"}, {"id": "e30993bee0", "t": "vec", "q": "X = [−2,0,0], Y = [0,1,0]: X × Y?", "a": "[0,0,−2].", "src": "Flashcards"}, {"id": "b5d08217d2", "t": "img", "q": "Sampling vs quantization?", "a": "Sampling limits where values are stored (the grid); quantization limits which values are allowed (the levels).", "src": "Flashcards"}, {"id": "cb2fc99001", "t": "img", "q": "Does a pixel have a size?", "a": "No: a pixel is a sample with a coordinate and a value; the display gives it a size.", "src": "Flashcards"}, {"id": "ccf4645f2a", "t": "line", "q": "Pixel vs linear resolution?", "a": "Pixel = m × n count (image only). Linear = ppi = pixels ÷ inches (depends on the device).", "src": "Flashcards"}, {"id": "c1f8c53cdf", "t": "img", "q": "Memory of 1024×768×24?", "a": "18,874,368 bits = 2,359,296 B ≈ 2.36 MB (2.25 MiB).", "src": "Flashcards"}, {"id": "70f4ecd141", "t": "img", "q": "ppi of a 42″ 16:9 1920×1080 display?", "a": "Width = 42·16/√337 = 36.61″ → 52.45 ppi.", "src": "Flashcards"}, {"id": "81c398d06a", "t": "img", "q": "Human-eye resolution rule?", "a": "Details down to 1 arc-minute: pixel x = D·tan(1/60°); n = W/x (30 cm at 50 cm → ≈ 2063 px).", "src": "Flashcards"}, {"id": "9407c5019c", "t": "line", "q": "Bilinear interpolation formulas?", "a": "P1 = αB+(1−α)A, P2 = αD+(1−α)C, N = βP2+(1−β)P1.", "src": "Flashcards"}, {"id": "c4d7ca429e", "t": "img", "q": "Q16 resampling (A=30, B=50, E=45, F=60, α=β=0.75)?", "a": "P1 = 45, P2 = 56.25, N = 53.44.", "src": "Flashcards"}, {"id": "e1f78c78ab", "t": "img", "q": "Halve resolution 2:1?", "a": "Each new pixel = average of a 2×2 block of old pixels.", "src": "Flashcards"}, {"id": "4fcaeaaf20", "t": "img", "q": "Why is a 10→5 ppi resample of a 1-px grid pattern bad?", "a": "Undersampling: every 2×2 block averages to the same grey, so the detail is lost (aliasing).", "src": "Flashcards"}, {"id": "78ddc59578", "t": "col", "q": "Number of colours with b bits per channel?", "a": "(2ᵇ)³, e.g. 3 bits → 512, 8 bits → 16.7 M.", "src": "Flashcards"}, {"id": "292b489120", "t": "col", "q": "Reduce 8-bit grey to 4 bits?", "a": "floor(v/16): 143 → 8, 240 → 15, 128 → 8.", "src": "Flashcards"}, {"id": "7b9ba7eac3", "t": "col", "q": "RGB → CMY?", "a": "C = 255−R, M = 255−G, Y = 255−B (on 0–1: 1 − value).", "src": "Flashcards"}, {"id": "1cde1e1aa5", "t": "col", "q": "Why CMYK has K?", "a": "Real C+M+Y inks give a muddy dark brown; black ink gives a real black and saves ink.", "src": "Flashcards"}, {"id": "c991e2f2ce", "t": "xf", "q": "Weighted grayscale formula?", "a": "0.299R + 0.587G + 0.114B (the eye is most sensitive to green).", "src": "Flashcards"}, {"id": "cf658e07a0", "t": "col", "q": "Grey of [128,0,128] and [255,255,0]?", "a": "≈ 53 and ≈ 226.", "src": "Flashcards"}, {"id": "1e807af901", "t": "dev", "q": "Mix [255,255,0] and [0,255,255] equally?", "a": "[128,255,128].", "src": "Flashcards"}, {"id": "dffb1d7914", "t": "col", "q": "HSV: what are H, S, V and their ranges?", "a": "Hue 0–360° (colour name), Saturation 0–1 (grey → pure), Value 0–1 (black → bright).", "src": "Flashcards"}, {"id": "81b31b201e", "t": "col", "q": "Where do saturated colours and greys lie in the HSV cone?", "a": "Saturated on the rim of each slice; greys on the central V axis; black at the tip.", "src": "Flashcards"}, {"id": "75a8387eb3", "t": "col", "q": "HSV of [7,7,0] at 3 bits per channel?", "a": "Yellow: H = 60°, S = 1, V = 1 (rim of the top disc).", "src": "Flashcards"}, {"id": "0a6836524e", "t": "col", "q": "Why does CIE XYZ exist?", "a": "No three real primaries can make every visible colour; XYZ uses imaginary primaries so all visible colours are non-negative.", "src": "Flashcards"}, {"id": "e1bb3587e0", "t": "col", "q": "Chromaticity diagram: mixing two colours gives?", "a": "A colour on the straight segment between them; three colours fill their triangle.", "src": "Flashcards"}, {"id": "237e90769c", "t": "fill", "q": "Why is a monitor's gamut a triangle?", "a": "Its three primaries are three points, and mixes fill only their triangle.", "src": "Flashcards"}, {"id": "9dd1b98875", "t": "col", "q": "Alpha blending formula?", "a": "C = C_src·α + C_dst·(1−α).", "src": "Flashcards"}, {"id": "c3cf530b4a", "t": "line", "q": "DDA step and cost?", "a": "y += m each column, plot round(y): one float add + one rounding per pixel.", "src": "Flashcards"}, {"id": "826c0056bd", "t": "line", "q": "Why does basic DDA assume slope ≤ 45°?", "a": "Otherwise y jumps more than 1 per column and leaves gaps; for steep lines step y instead.", "src": "Flashcards"}, {"id": "4f83487c60", "t": "line", "q": "DDA (0,0)→(5,3) pixels?", "a": "(0,0) (1,1) (2,1) (3,2) (4,2) (5,3).", "src": "Flashcards"}, {"id": "5c46266a4a", "t": "line", "q": "Bresenham parameters?", "a": "a = 2Δy, b = 2Δy − 2Δx, p₀ = 2Δy − Δx; p < 0 → same row, p += a; p ≥ 0 → row up, p += b.", "src": "Flashcards"}, {"id": "cd29258ca7", "t": "line", "q": "Bresenham (0,0)→(5,2) pixels?", "a": "(0,0) (1,0) (2,1) (3,1) (4,2) (5,2) with p = −1, 3, −3, 1, −5.", "src": "Flashcards"}, {"id": "94251455af", "t": "line", "q": "Bresenham starts from which endpoint?", "a": "The one with the smaller x (the result can differ from the other end).", "src": "Flashcards"}, {"id": "d90aa25b0e", "t": "line", "q": "Can aliasing be removed?", "a": "No, only reduced: anti-aliasing (2 nearest pixels per column, intensity by distance, constant sum) or FSAA.", "src": "Flashcards"}, {"id": "a86f97a161", "t": "fill", "q": "Midpoint circle rules?", "a": "Start (0,r), p₀ = 5/4 − r; p < 0 → (x+1,y), p += 2x₊+1; else (x+1,y−1), p += 2x₊+1−2y₊; mirror 8 ways.", "src": "Flashcards"}, {"id": "28467d7208", "t": "fill", "q": "Circle r = 10 first octant?", "a": "(0,10) (1,10) (2,10) (3,10) (4,9) (5,9) (6,8) (7,7); 56 pixels in total.", "src": "Flashcards"}, {"id": "ddf0017497", "t": "fill", "q": "Scan-line fill?", "a": "Per row: find crossings with the contour, sort, fill between pairs; vertex counted once if its edges are on opposite sides, twice if on the same side.", "src": "Flashcards"}, {"id": "66562ee64e", "t": "fill", "q": "Recursive flood-fill call order (lecture)?", "a": "left (x−1), right (x+1), up (y+1), down (y−1); the order decides the painting order.", "src": "Flashcards"}, {"id": "57adda1474", "t": "fill", "q": "Barycentric inside test?", "a": "U = αA+βB+γC, α+β+γ = 1; inside ⇔ α, β, γ ≥ 0.", "src": "Flashcards"}, {"id": "561fa14b97", "t": "fill", "q": "Barycentric of pixel (1,2) in A(0,0), B(0,4), C(4,0)?", "a": "α = 0.25, β = 0.5, γ = 0.25 → inside; grey = 0.25·255 + 0.25·128 ≈ 96.", "src": "Flashcards"}, {"id": "377a8c9b3b", "t": "fill", "q": "Barycentric interpolation?", "a": "f(U) = α f(A) + β f(B) + γ f(C) (colour, depth, UV).", "src": "Flashcards"}, {"id": "db13522e01", "t": "xf", "q": "Homogeneous 2D point and why?", "a": "(x, y, 1): translation, scaling and rotation all become 3×3 matrices and compose by multiplication.", "src": "Flashcards"}, {"id": "94daa1f451", "t": "xf", "q": "Apply T1 then T2 then T3?", "a": "M = T3·T2·T1 (the first transform is rightmost).", "src": "Flashcards"}, {"id": "72d309c373", "t": "xf", "q": "Translate [1,−2] then scale (0.5,1)?", "a": "M = S·T = `[[0.5,0,0.5],[0,1,−2],[0,0,1]]`.", "src": "Flashcards"}, {"id": "6415491d5e", "t": "xf", "q": "Transform about a point p?", "a": "T(p) · X · T(−p): move to the origin, transform, move back.", "src": "Flashcards"}, {"id": "d5d7977921", "t": "xf", "q": "Scale (1.5, 0.5) about (−3,2)?", "a": "M = `[[1.5,0,1.5],[0,0.5,1],[0,0,1]]`; (−5,0) → (−6,1).", "src": "Flashcards"}, {"id": "1fcdae08fe", "t": "xf", "q": "Frame-change matrix?", "a": "Rows = the new axes u, v (in old coordinates) × translation by −e.", "src": "Flashcards"}, {"id": "28cffb8905", "t": "xf", "q": "P(2,2) in a frame rotated 90° CCW?", "a": "(2, −2).", "src": "Flashcards"}, {"id": "4bc168b595", "t": "clip", "q": "Cohen–Sutherland codes and decisions?", "a": "4 bits [above, below, right, left]; AND ≠ 0 → reject; both 0000 → accept; else clip against an edge and retest.", "src": "Flashcards"}, {"id": "1d0f236f5f", "t": "clip", "q": "Segment (8,10)–(15,3) vs window (4,0)–(10,5)?", "a": "Codes 1000/0010 → clip top at (13,5) → 0010 & 0010 → reject (it passes above-right of the corner).", "src": "Flashcards"}, {"id": "e3adc4fff1", "t": "clip", "q": "Sutherland–Hodgman four cases?", "a": "out→in: add I and P; in→in: add P; in→out: add I; out→out: nothing. One window edge at a time.", "src": "Flashcards"}, {"id": "c8b560769d", "t": "clip", "q": "Triangle (7,1),(1,4),(5,10) clipped to window (4,0)–(10,5)?", "a": "(4,2.5), (4,5), (6.11,5), (7,1).", "src": "Flashcards"}, {"id": "77eb068d10", "t": "bez", "q": "Curve representations?", "a": "Implicit f(x,y) = 0 (test a point), parametric (x,y) = f(t) (generate points), generative/procedural.", "src": "Flashcards"}, {"id": "0e960adaa8", "t": "bez", "q": "G0, G1, G2 continuity?", "a": "G0 shared point; G1 + collinear tangents; G2 + equal curvature.", "src": "Flashcards"}, {"id": "c0c56bff3c", "t": "bez", "q": "Bézier properties?", "a": "Through the first and last points; end tangents along the first/last control segments; inside the convex hull; global control; order matters.", "src": "Flashcards"}, {"id": "fecb5411ac", "t": "bez", "q": "Quadratic Bézier (1,1),(4,8),(10,1) at t = 0.5?", "a": "(4.75, 4.5).", "src": "Flashcards"}, {"id": "cca7ad1ff5", "t": "bez", "q": "Cubic Bézier (1,1),(3,−7),(8,−7),(10,1) at t = 0.5?", "a": "(5.5, −5).", "src": "Flashcards"}, {"id": "94a37ef58e", "t": "bez", "q": "Smooth (G1) Bézier join?", "a": "Next curve starts at the last point, and the last control point, joint and next control point are collinear.", "src": "Flashcards"}, {"id": "bc0b0cbdc1", "t": "dev", "q": "T/F: With raster display, all pixels are shown at the same time.", "a": "❌ FALSE. Pixels are shown one after another, row by row (raster scan), from the frame buffer.", "src": "G15 T/F"}, {"id": "6ac812c10e", "t": "dev", "q": "T/F: Between the frame buffer and a CRT monitor you need a digital-to-analogue converter (DAC).", "a": "✅ TRUE. The CRT's electron beams are driven by analogue voltages.", "src": "G15 T/F"}, {"id": "140f241502", "t": "dev", "q": "T/F: Between the frame buffer and a CRT you need an analogue-to-digital converter.", "a": "❌ FALSE. It's digital → analogue (DAC).", "src": "G15 T/F"}, {"id": "22eef56b0e", "t": "dev", "q": "T/F: The image refresh rate can be anything.", "a": "❌ FALSE. Below ≈ 50–60 Hz the image flickers.", "src": "G15 T/F"}, {"id": "2ce36b96b5", "t": "dev", "q": "T/F: Modern display systems should refresh above 50 Hz.", "a": "✅ TRUE. Below that, flicker is visible.", "src": "G15 T/F"}, {"id": "a2cc1ffe07", "t": "dev", "q": "T/F: A double frame buffer lets the computer build the next image while the previous one is being displayed.", "a": "✅ TRUE (ping-pong: draw into B while A is shown, then swap). 🛠 fixed: the zdaj.se bank marks this false.", "src": "G15 T/F"}, {"id": "557bba1ca3", "t": "dev", "q": "T/F: CRT monitors use yellow, green and red phosphors.", "a": "❌ FALSE. Red, green and **blue**.", "src": "G15 T/F"}, {"id": "47146f52f8", "t": "dev", "q": "T/F: On LCDs the pixels of the image are shown in a fixed order.", "a": "✅ TRUE. They're still refreshed line by line from the frame buffer. (One student file says NIE.)", "src": "G15 T/F"}, {"id": "5b45f603b9", "t": "dev", "q": "T/F: A shorter access time of the frame-buffer memory increases its bandwidth.", "a": "✅ TRUE. Bandwidth = bytes per second.", "src": "G15 T/F"}, {"id": "f31322e9d4", "t": "dev", "q": "T/F: LCD monitors use the HLS / CMY colour model.", "a": "❌ FALSE. They use RGB sub-pixels with colour filters.", "src": "G15 T/F"}, {"id": "93f1456657", "t": "dev", "q": "T/F: An ordinary CRT monitor is an example of a vector display.", "a": "❌ FALSE ⚠️. A PC CRT monitor is a **raster** display (vector CRTs existed, e.g. oscilloscope-type screens).", "src": "G15 T/F"}, {"id": "955b7975eb", "t": "dev", "q": "T/F: An LCD monitor is an example of a vector display.", "a": "❌ FALSE. It's raster.", "src": "G15 T/F"}, {"id": "072a9fd1c6", "t": "dev", "q": "T/F: For vector devices, the drawing speed depends on how complex the objects are.", "a": "✅ TRUE. The beam or pen traces every line, so more lines take longer.", "src": "G15 T/F"}, {"id": "4ea1fbac8d", "t": "dev", "q": "T/F: For raster devices, the drawing (refresh) speed depends on how complex the objects are.", "a": "❌ FALSE. The whole frame is refreshed at a fixed rate, whatever it shows.", "src": "G15 T/F"}, {"id": "e218e31716", "t": "dev", "q": "T/F: In the newest graphics cards the modelling (geometry) computations are done by the GPU.", "a": "✅ TRUE. Vertex shaders transform the geometry on the GPU.", "src": "G15 T/F"}, {"id": "d319eea2ab", "t": "dev", "q": "T/F: A pixel (fragment) shader lets you write your own algorithm for processing vertices.", "a": "❌ FALSE. That's the **vertex** shader. The fragment shader colours pixels.", "src": "G15 T/F"}, {"id": "fc55df9dcd", "t": "dev", "q": "T/F: Lowering the maximum pixel resolution means you need more frame-buffer memory.", "a": "❌ FALSE. Fewer pixels need less memory.", "src": "G15 T/F"}, {"id": "a93b24e82a", "t": "dev", "q": "T/F: Rasterisation is converting vector graphics into raster graphics (continuous → discrete).", "a": "✅ TRUE.", "src": "G15 T/F"}, {"id": "6618e75516", "t": "dev", "q": "How many frames for a 3-minute animation at 24 frames/s?", "a": "24 · 180 = **4320**.", "src": "G15 T/F"}, {"id": "5d32ab942a", "t": "dev", "q": "640×480×24: memory, time per pixel at 50 Hz, time to send over a 56 kb/s modem?", "a": "921,600 B ≈ **0.92 MB** · 1/(640·480·50) = **65.1 ns** · 7,372,800 bits / 56,000 = **131.7 s** (not \"0.5 MB\", \"30 ns\" or \"6 s\").", "src": "G15 T/F"}, {"id": "a9f5711fa8", "t": "dev", "q": "1024×768×24: memory and time per pixel at 50 Hz?", "a": "2,359,296 B ≈ **2.36 MB** · **25.4 ns**.", "src": "G15 T/F"}, {"id": "d175e08255", "t": "dev", "q": "T/F: Greyscale images use 24 bits per pixel.", "a": "❌ FALSE. Usually **8** bits (256 grey levels).", "src": "G15 T/F"}, {"id": "f13f59e619", "t": "dev", "q": "T/F: LCD monitors have resolutions above 250 dpi.", "a": "❌ FALSE ⚠️. Desktop monitors are about 90–160 dpi; only phone screens go above 300.", "src": "G15 T/F"}, {"id": "a2d63b3ada", "t": "dev", "q": "T/F: The dot size (dot pitch) of a CRT has no effect on image quality.", "a": "❌ FALSE. A smaller pitch gives finer detail.", "src": "G15 T/F"}, {"id": "b9183e2715", "t": "dev", "q": "T/F: A triad is a set of four phosphor dots on the screen.", "a": "❌ FALSE. **Three** (R, G, B).", "src": "G15 T/F"}, {"id": "fb2b6f9503", "t": "dev", "q": "T/F: An LCD can display images at different resolutions.", "a": "✅ TRUE ⚠️. By scaling, though the native resolution looks sharpest.", "src": "G15 T/F"}, {"id": "e273095224", "t": "dev", "q": "T/F: The refresh rate must be at least 200 Hz; a typical CRT time per pixel is 20 ms.", "a": "❌ FALSE, FALSE. ≥ 50–60 Hz is enough; the time per pixel is in **nanoseconds**.", "src": "G15 T/F"}, {"id": "932a06e70b", "t": "dev", "q": "T/F: CIE XYZ isn't used in CRTs because XYZ phosphors would be too expensive.", "a": "❌ FALSE. X, Y, Z are **imaginary** primaries: no phosphor can emit them at any price.", "src": "G15 T/F"}, {"id": "b23ac0be42", "t": "dev", "q": "T/F: A vector representation of a segment holds information about every pixel of the segment.", "a": "❌ FALSE. Only the end points (and attributes).", "src": "G15 T/F"}, {"id": "e1d83de0ea", "t": "dev", "q": "T/F: A 1024×768×24 image needs at least 2 MB; at 50 Hz there are 30 ns per pixel; a 56 kb/s modem sends it in 5 s.", "a": "✅ TRUE ⚠️ (2,359,296 B = 2.36 MB = 2.25 MiB), ❌ FALSE (**25.4 ns**), ❌ FALSE (**337 s**). 🛠 fixed: a student file marks the first one N.", "src": "G15 T/F"}, {"id": "0676ba2e7b", "t": "img", "q": "T/F: Doubling the resolution horizontally and vertically doubles the memory needed.", "a": "❌ FALSE. 2 × 2 = **4×** the pixels → 4× the memory.", "src": "G15 T/F"}, {"id": "f0932f2f58", "t": "img", "q": "T/F: A digital camera is assumed to use area sampling.", "a": "✅ TRUE. Each sensor cell integrates light over its area.", "src": "G15 T/F"}, {"id": "a97b966743", "t": "img", "q": "T/F: A digital camera uses point sampling.", "a": "❌ FALSE. It uses area sampling.", "src": "G15 T/F"}, {"id": "b610ba60fc", "t": "img", "q": "T/F: Point sampling of the same image gives fewer samples than area sampling.", "a": "❌ FALSE. The same grid gives the same number of samples. Only what each sample represents differs.", "src": "G15 T/F"}, {"id": "ca29f3f945", "t": "img", "q": "T/F: The dpi value determines the size of a digital image.", "a": "❌ FALSE. A digital image's size is in pixels. dpi only converts it to inches when printed.", "src": "G15 T/F"}, {"id": "3d1f7c3063", "t": "img", "q": "T/F: A thicker pen on a plotter lowers its addressability.", "a": "❌ FALSE ⚠️. Addressability = number of positions the pen can reach. A thicker pen hurts the *resolution* (fine detail).", "src": "G15 T/F"}, {"id": "726c754b01", "t": "img", "q": "T/F: Area-sampling a black-and-white drawing into 8-bit greyscale can give grey pixels.", "a": "✅ TRUE. A pixel half covered by black gets ≈ 50 % grey (that's how antialiasing works).", "src": "G15 T/F"}, {"id": "17dfa3cb03", "t": "img", "q": "T/F: Raster point coordinates are not integers.", "a": "❌ FALSE. Raster (pixel) coordinates are integers.", "src": "G15 T/F"}, {"id": "0dc52c069c", "t": "img", "q": "T/F: Screen coordinates must have their origin in the top-left corner.", "a": "❌ FALSE. That's a common convention, but the origin **may** be bottom-left (as in the lecture's maths).", "src": "G15 T/F"}, {"id": "6698a61933", "t": "img", "q": "T/F: Pixel coordinates lie in the ranges given by the pixel resolution of the screen.", "a": "✅ TRUE (0…W−1, 0…H−1).", "src": "G15 T/F"}, {"id": "6d809120af", "t": "img", "q": "T/F: The linear resolution of a 15″ 4:3 monitor at 800×600 is 68 ppi.", "a": "❌ FALSE. Width = 15·4/5 = 12″ → 800/12 = **66.7 ppi**.", "src": "G15 T/F"}, {"id": "25eae25ec3", "t": "img", "q": "T/F: Rotating an image by 90° means swapping the rows and columns.", "a": "✅ TRUE (transpose + flip).", "src": "G15 T/F"}, {"id": "602119fc2e", "t": "img", "q": "T/F: A mirror image (horizontal flip) is made by swapping the matching columns.", "a": "✅ TRUE.", "src": "G15 T/F"}, {"id": "b830581ad5", "t": "img", "q": "Image 10×6 cm on a monitor with 0.2 mm dot pitch, printed at 600 dpi (1 pixel = 1 dot): printed size?", "a": "500 × 300 px → 0.833″ × 0.5″ = **2.12 × 1.27 cm**.", "src": "G15 T/F"}, {"id": "e89c9a3dd5", "t": "img", "q": "Bilinear: A = 30, B = 50, C = 45, D = 60, α = 0.4, β = 0.2: N?", "a": "P1 = 0.4·50 + 0.6·30 = **38**, P2 = 0.4·60 + 0.6·45 = **51**, N = 0.2·51 + 0.8·38 = **40.6**.", "src": "G15 T/F"}, {"id": "97e9ddbada", "t": "img", "q": "T/F: With a colour lookup table (palette), the frame buffer holds the full colour of each pixel.", "a": "❌ FALSE. It holds an **index** into the table.", "src": "G15 T/F"}, {"id": "6732e821d7", "t": "img", "q": "T/F: With a lookup table, the bits per pixel set the number of colours in the table.", "a": "✅ TRUE. b bits → 2ᵇ entries.", "src": "G15 T/F"}, {"id": "cfb48ef071", "t": "img", "q": "Palette system showing 512 of 65,536 (2¹⁶) colours: size of the colour table?", "a": "512 entries × 16 bits = 8,192 bits = **1,024 B**; each pixel stores a **9-bit** index.", "src": "G15 T/F"}, {"id": "fcd30ad52d", "t": "img", "q": "Frame buffer for 2048×2048 RGB (8 bits per channel)? And with a 256-entry palette?", "a": "2048·2048·3 = **12,582,912 B ≈ 12.6 MB**. Palette: 4,194,304 B of indices + 768 B table = **4,195,072 B ≈ 4.2 MB**.", "src": "G15 T/F"}, {"id": "68a0ac6937", "t": "img", "q": "Pixels in a 2 × 3 inch image on a 100 dpi monitor?", "a": "200 × 300 = **60,000**.", "src": "G15 T/F"}, {"id": "2dcd0d6630", "t": "img", "q": "How do you show a 1024×768 image on an 800×600 LCD?", "a": "Resample (scale by 0.78, averaging the source pixels that fall in each target pixel), or show it 1:1 and crop / pan.", "src": "G15 T/F"}, {"id": "d7702a9601", "t": "col", "q": "T/F: Perceived colour depends only on the object's properties (its colour, material…).", "a": "❌ FALSE. It also depends on the light source and the observer. (Without \"only\", \"depends on the object\" is TRUE.)", "src": "G15 T/F"}, {"id": "a4f8c612cc", "t": "col", "q": "T/F: Colour is a perceptual sensation of the human observer.", "a": "✅ TRUE.", "src": "G15 T/F"}, {"id": "f95e0dfb10", "t": "col", "q": "T/F: In HSV, the saturation is given in degrees.", "a": "❌ FALSE. S is in 0…1. **Hue** is in degrees (0–360°).", "src": "G15 T/F"}, {"id": "bfe177afc8", "t": "col", "q": "T/F: In HSV, the hue is given in percent.", "a": "❌ FALSE. In degrees.", "src": "G15 T/F"}, {"id": "f706cdb65d", "t": "col", "q": "T/F: In HSV, the component S is the saturation.", "a": "✅ TRUE.", "src": "G15 T/F"}, {"id": "aaa4c86077", "t": "col", "q": "T/F: In HSV, the main axis of the cone/pyramid holds the saturation values 0–1.", "a": "❌ FALSE. The axis is **V** (value/brightness), with S = 0 on it.", "src": "G15 T/F"}, {"id": "2abe879bf3", "t": "col", "q": "T/F: In HSV, white lies on the side surface of the pyramid.", "a": "❌ FALSE. White is at the **centre of the top** (V = 1, S = 0).", "src": "G15 T/F"}, {"id": "3bbe342e2a", "t": "col", "q": "T/F: In HLS, white lies on the side surface of the double cone.", "a": "❌ FALSE. It's at the **top apex** (L = 1).", "src": "G15 T/F"}, {"id": "8fc857b72c", "t": "col", "q": "T/F: In RGB \"full colour\", each component has 32 (or 512) levels.", "a": "❌ FALSE. 8 bits → **256** levels per channel (2²⁴ ≈ 16.7 M colours).", "src": "G15 T/F"}, {"id": "92b6bd79d0", "t": "col", "q": "T/F: In a full-colour system each component uses 10 bits.", "a": "❌ FALSE. 8 bits (24 bpp). 10-bit panels are \"deep colour\".", "src": "G15 T/F"}, {"id": "6405a4ae56", "t": "col", "q": "T/F: In 24-bit RGB, black is (255, 255, 255).", "a": "❌ FALSE. Black is (0,0,0) and white is (255,255,255).", "src": "G15 T/F"}, {"id": "dd21151308", "t": "col", "q": "T/F: In CMY, white is (0, 0, 0).", "a": "✅ TRUE. No ink = white paper.", "src": "G15 T/F"}, {"id": "dd60bdb5eb", "t": "col", "q": "T/F: In CMY, black is (0, 0, 0).", "a": "❌ FALSE. Black = (255,255,255) or (1,1,1), full ink.", "src": "G15 T/F"}, {"id": "12d088d2f0", "t": "col", "q": "T/F: In CMY, greys lie on the Y axis.", "a": "❌ FALSE. Greys lie on the **diagonal** C = M = Y.", "src": "G15 T/F"}, {"id": "093e1088c8", "t": "col", "q": "T/F: RGB lets you produce shades of grey.", "a": "✅ TRUE (R = G = B).", "src": "G15 T/F"}, {"id": "c90819774e", "t": "col", "q": "T/F: The RGB model used in computer graphics is discrete.", "a": "✅ TRUE. Each channel is a finite word (8 bits → 256 values).", "src": "G15 T/F"}, {"id": "54298b6fc6", "t": "col", "q": "T/F: RGB and CMY can represent all visible colours.", "a": "❌ FALSE. No 3 real primaries cover the whole horseshoe. Only CIE XYZ covers all visible colours.", "src": "G15 T/F"}, {"id": "64965843d6", "t": "col", "q": "T/F: CIE XYZ represents all visible colours.", "a": "✅ TRUE. That's what it was built for (with imaginary primaries).", "src": "G15 T/F"}, {"id": "0be4e245bb", "t": "col", "q": "T/F: CIE XYZ is the colour model used in top-quality CRT monitors.", "a": "❌ FALSE. 🛠 fixed (a student file says TAK). XYZ is a **theoretical** model with imaginary primaries. No device emits it.", "src": "G15 T/F"}, {"id": "0fd5e1d0b7", "t": "col", "q": "T/F: On the chromaticity diagram you can point to the colour of a given wavelength.", "a": "✅ TRUE. Wavelengths are written along the horseshoe edge.", "src": "G15 T/F"}, {"id": "845ab134c7", "t": "col", "q": "T/F: Non-spectral colours can't be shown on the chromaticity diagram.", "a": "❌ FALSE. Purples (the bottom line) and all unsaturated colours (the inside) are on it.", "src": "G15 T/F"}, {"id": "3aa8ef5b14", "t": "col", "q": "T/F: Saturated (spectral) colours lie on the boundary of the xy chromaticity diagram.", "a": "✅ TRUE. 🛠 fixed: the zdaj.se bank marks this false.", "src": "G15 T/F"}, {"id": "5a38a7676c", "t": "col", "q": "T/F: Mixing two colours gives a point on the extension of the segment joining them.", "a": "❌ FALSE. It lies **on the segment** between them (closer to the stronger one).", "src": "G15 T/F"}, {"id": "3cf5eb0c65", "t": "col", "q": "T/F: Mixing equal amounts of 500 nm and 560 nm light does NOT give the colour of 530 nm.", "a": "✅ TRUE. The mix lies on the chord **inside** the horseshoe, less saturated than spectral 530 nm.", "src": "G15 T/F"}, {"id": "03aa599316", "t": "col", "q": "T/F: Mixing 600 nm and 500 nm light can give the colour of 520 nm.", "a": "❌ FALSE. Every mix lies on the chord between them, not on the edge at 520 nm.", "src": "G15 T/F"}, {"id": "97f99951d9", "t": "col", "q": "T/F: Additively mixing red and blue gives white.", "a": "❌ FALSE. It gives **magenta**. White needs R + G + B (or complementary pairs).", "src": "G15 T/F"}, {"id": "c9815163e3", "t": "col", "q": "T/F: The complementary colour of green is red.", "a": "❌ FALSE ⚠️. Across the white point from green is **magenta** (on the purple line). 🛠 fixed: one student file says TAK. \"Can be a suitable shade of red(-purple)\": defensible TRUE.", "src": "G15 T/F"}, {"id": "a37d656840", "t": "col", "q": "T/F: \"C6500\" (D65) means black.", "a": "❌ FALSE. 🛠 fixed: the zdaj.se bank marks this true. D65 = **daylight white** ≈ the colour of a black body heated to 6500 K.", "src": "G15 T/F"}, {"id": "b4d99cee8b", "t": "col", "q": "T/F: sRGB uses the D65 white point.", "a": "✅ TRUE.", "src": "G15 T/F"}, {"id": "80c101ee30", "t": "col", "q": "T/F: Printers use subtractive colour mixing.", "a": "✅ TRUE (CMY(K) inks absorb light).", "src": "G15 T/F"}, {"id": "7debb355e8", "t": "col", "q": "T/F: HLS is an example of a perceptual (user-oriented) colour model.", "a": "✅ TRUE.", "src": "G15 T/F"}, {"id": "d5c4f1498d", "t": "col", "q": "T/F: Colour systems (management) make colours repeatable across different printers.", "a": "✅ TRUE. That's their purpose (device profiles), though gamut differences remain.", "src": "G15 T/F"}, {"id": "e0aa6f0e98", "t": "col", "q": "CIE: colour (1/9, 1/6), white (1/3, 1/3): coordinates with half the saturation?", "a": "The midpoint: x = **2/9**, y = **1/4**, z = 1 − x − y = **19/36**.", "src": "G15 T/F"}, {"id": "26c6dd3743", "t": "col", "q": "Grey levels on a 900-dpi black-and-white printer simulating 300-dpi greys?", "a": "3×3 micro-pattern = 9 dots → **10** levels (0…9 dots).", "src": "G15 T/F"}, {"id": "e66598d3dd", "t": "col", "q": "T/F: In HSV one component (H) is responsible for the hue.", "a": "✅ TRUE.", "src": "G15 T/F"}, {"id": "21d3af07ee", "t": "col", "q": "T/F: In HSV, H is the saturation.", "a": "❌ FALSE. H = hue, S = saturation, V = value.", "src": "G15 T/F"}, {"id": "a8e832bcd8", "t": "col", "q": "T/F: In RGB, the greys lie on the Y axis.", "a": "❌ FALSE. On the **diagonal** R = G = B. (There is no Y axis in RGB.)", "src": "G15 T/F"}, {"id": "bee02934ce", "t": "col", "q": "T/F: In RGB, white is (0,0,0).", "a": "❌ FALSE. (0,0,0) is black in RGB; it is **white in CMY**.", "src": "G15 T/F"}, {"id": "0836512813", "t": "col", "q": "T/F: A grey pixel in 24-bit CMY can be (26, 26, 26).", "a": "✅ TRUE. Equal C = M = Y is always a grey.", "src": "G15 T/F"}, {"id": "ddc726ef9f", "t": "col", "q": "T/F: In CIE XYZ, the X, Y, Z primaries are chosen to suit the application.", "a": "❌ FALSE. They're fixed by the 1931 CIE standard.", "src": "G15 T/F"}, {"id": "f4ade82c79", "t": "col", "q": "T/F: XYZ colours have no counterparts in RGB.", "a": "✅ TRUE ⚠️. The X, Y, Z primaries are imaginary (outside the horseshoe), so no RGB device can show them.", "src": "G15 T/F"}, {"id": "5a41430e53", "t": "col", "q": "T/F: In YCbCr the colour information is in all three components.", "a": "❌ FALSE. Y is brightness only; the colour is in Cb and Cr.", "src": "G15 T/F"}, {"id": "a2908050ba", "t": "col", "q": "How many colours do 8-, 16- and 24-bit pixels give?", "a": "2⁸ = **256**, 2¹⁶ = **65,536**, 2²⁴ = **16,777,216**.", "src": "G15 T/F"}, {"id": "0db43d62fc", "t": "line", "q": "T/F: The slope of the segment doesn't matter for line drawing.", "a": "❌ FALSE. The basic DDA/Bresenham step along x only for |m| ≤ 1. Steeper lines swap the roles of x and y.", "src": "G15 T/F"}, {"id": "09f0b49fef", "t": "line", "q": "T/F: In Bresenham the slope matters, and at each column (row) you choose one of two pixels.", "a": "✅ TRUE.", "src": "G15 T/F"}, {"id": "020a893d81", "t": "line", "q": "T/F: DDA uses only integer arithmetic.", "a": "❌ FALSE. DDA adds the float slope m each step. **Bresenham** is integer-only.", "src": "G15 T/F"}, {"id": "e4e07d7f7d", "t": "line", "q": "T/F: In DDA each pixel is computed directly from the line equation y = ax + b.", "a": "❌ FALSE. DDA is **incremental**: y_{k+1} = y_k + m.", "src": "G15 T/F"}, {"id": "19ff21db73", "t": "line", "q": "T/F: Bresenham uses the line equation in every cycle.", "a": "❌ FALSE. It updates an integer decision value p with + a or + b.", "src": "G15 T/F"}, {"id": "e0c0e572ee", "t": "line", "q": "T/F: Bresenham is efficient because its main loop uses only integer multiplication.", "a": "❌ FALSE. It uses only integer **addition** (and a sign test).", "src": "G15 T/F"}, {"id": "1969f7735c", "t": "line", "q": "T/F: DDA can light the wrong pixels when drawing very long segments.", "a": "✅ TRUE. The rounding error of the float slope accumulates.", "src": "G15 T/F"}, {"id": "3d242e4deb", "t": "line", "q": "T/F: Bresenham (2,0)–(5,6) has 6 pixels.", "a": "❌ FALSE. It's steep, |Δy| = 6 → **7** pixels.", "src": "G15 T/F"}, {"id": "7a07b88cd2", "t": "line", "q": "T/F: Bresenham (2,6)–(4,1) has 6 pixels.", "a": "✅ TRUE. |Δy| = 5 → 6 pixels: (2,6) (2,5) (3,4) (3,3) (4,2) (4,1).", "src": "G15 T/F"}, {"id": "17e8e5ed2b", "t": "line", "q": "T/F: Bresenham (8,4)–(12,6) lights 4 pixels.", "a": "❌ FALSE. Δx = 4 → **5** pixels: (8,4) (9,5) (10,5) (11,6) (12,6).", "src": "G15 T/F"}, {"id": "80cda37b1f", "t": "line", "q": "T/F: The 3rd pixel of Bresenham (2,1)–(10,5) is (4,2).", "a": "✅ TRUE. Pixels (2,1), (3,2 or 3,1 by the tie rule), **(4,2)**, … 🛠 fixed: the zdaj.se bank marks this false, but both tie rules give (4,2) as the 3rd pixel.", "src": "G15 T/F"}, {"id": "d72598cfe4", "t": "line", "q": "T/F: The 4th pixel of Bresenham (2,1)–(10,5) is (4,2).", "a": "❌ FALSE. The 4th pixel is in column 5: (5,3) (tie → up) or (5,2).", "src": "G15 T/F"}, {"id": "6ad1d7d0f3", "t": "line", "q": "T/F: Two intersecting segments may have no pixel in common.", "a": "✅ TRUE. (0,0)–(3,3) and (0,3)–(3,0) cross between pixels: {(0,0),(1,1),(2,2),(3,3)} vs {(0,3),(1,2),(2,1),(3,0)}.", "src": "G15 T/F"}, {"id": "1ad81845a4", "t": "line", "q": "T/F: Two intersecting segments have at most one pixel in common.", "a": "❌ FALSE. 🛠 fixed (a student file says TAK). Nearly parallel crossing lines share **several** pixels.", "src": "G15 T/F"}, {"id": "10e2845bc3", "t": "line", "q": "T/F: Two non-parallel intersecting segments always share exactly 1 pixel.", "a": "❌ FALSE. They may share 0 or several.", "src": "G15 T/F"}, {"id": "cc4f9092ed", "t": "fill", "q": "T/F: Raising the raster resolution increases the time to draw lines and circles.", "a": "✅ TRUE. More pixels to compute.", "src": "G15 T/F"}, {"id": "f24e63a062", "t": "fill", "q": "T/F: Circle drawing is sped up using the circle's symmetry.", "a": "✅ TRUE. Compute one octant, mirror it 8 ways.", "src": "G15 T/F"}, {"id": "ff5e5c50f4", "t": "fill", "q": "4th pixel of the midpoint circle with r = 16 (starting at (0,16))?", "a": "p₀ = 5/4 − 16 = −14.75 → (1,16) p −11.75 → (2,16) p −6.75 → **(3,16)** (p becomes 0.25, so the next one drops to (4,15)).", "src": "G15 T/F"}, {"id": "f50cb07cc8", "t": "line", "q": "T/F: Aliasing is caused by the finite resolution of the raster.", "a": "✅ TRUE.", "src": "G15 T/F"}, {"id": "3bfba60831", "t": "line", "q": "T/F: Aliasing is caused by using the wrong algorithms / finite precision of calculations.", "a": "❌ FALSE. It's the finite raster resolution (undersampling).", "src": "G15 T/F"}, {"id": "43c241f4f7", "t": "line", "q": "T/F: Aliasing can be removed completely (by software or hardware).", "a": "❌ FALSE. It can only be **reduced** (antialiasing).", "src": "G15 T/F"}, {"id": "c237880d39", "t": "line", "q": "T/F: Aliasing can be removed with Gouraud shading.", "a": "❌ FALSE. Gouraud is a shading method, unrelated.", "src": "G15 T/F"}, {"id": "147d6399a8", "t": "line", "q": "T/F: In the sub-pixel method you estimate how much of the pixel the segment covers.", "a": "✅ TRUE (area coverage → intensity).", "src": "G15 T/F"}, {"id": "00372b47b9", "t": "line", "q": "T/F: Changing the slope of a segment changes how it looks (its jaggedness and brightness).", "a": "✅ TRUE. A 45° line has √2 × fewer pixels per unit length, so it looks dimmer.", "src": "G15 T/F"}, {"id": "6689193a26", "t": "line", "q": "Antialiasing A(0,0)–B(4,1), 2 pixels per column: brightness of (1,0) and (1,1)?", "a": "The true y at x = 1 is 0.25 → (1,0) gets **75 %**, (1,1) gets **25 %** of full intensity.", "src": "G15 T/F"}, {"id": "4d5184a904", "t": "fill", "q": "T/F: Scan-line filling needs a starting (seed) point.", "a": "❌ FALSE. That's the seed fill. Scan-line uses the edge list.", "src": "G15 T/F"}, {"id": "0d89212cee", "t": "fill", "q": "T/F: Scan-line filling is an example of a seed-fill algorithm.", "a": "❌ FALSE.", "src": "G15 T/F"}, {"id": "dfd489fc68", "t": "fill", "q": "T/F: Seed fill doesn't need the equation of the outline.", "a": "✅ TRUE. It just tests pixel colours until it hits the border.", "src": "G15 T/F"}, {"id": "03701d83e8", "t": "fill", "q": "T/F: For a seed fill the region must be closed.", "a": "✅ TRUE. Otherwise the fill \"leaks\" out.", "src": "G15 T/F"}, {"id": "c1f88cd853", "t": "fill", "q": "T/F: Seed fill can fill non-convex shapes.", "a": "✅ TRUE.", "src": "G15 T/F"}, {"id": "a5c7d9fec1", "t": "fill", "q": "T/F: The z-buffer algorithm is used to fill polygons.", "a": "❌ FALSE. It solves visibility.", "src": "G15 T/F"}, {"id": "5e1a4a592c", "t": "fill", "q": "Is the point (2,1) inside the triangle (1,3), (4,1), (3,4)?", "a": "α = 6/7, β = 5/7, **γ = −4/7 < 0** → **outside**.", "src": "G15 T/F"}, {"id": "3b2ce52526", "t": "line", "q": "T/F: Bresenham always draws from the left end point to the right one.", "a": "✅ TRUE ⚠️. It swaps the end points so it runs from the smaller x (steep lines: from the smaller y).", "src": "G15 T/F"}, {"id": "c5005bedb1", "t": "line", "q": "T/F: The third pixel of Bresenham (2,1)–(15,5) is (5,2).", "a": "❌ FALSE. Δx = 13, Δy = 4, p₀ = −5: (2,1) (3,1) **(4,2)**.", "src": "G15 T/F"}, {"id": "05c1bd7acf", "t": "fill", "q": "T/F: The midpoint algorithm chooses one of 3 pixels in each column.", "a": "❌ FALSE. One of **2** (same row or the next one).", "src": "G15 T/F"}, {"id": "a083ce68f7", "t": "fill", "q": "T/F: The subpixel method is used in the midpoint algorithm.", "a": "❌ FALSE ⚠️. Midpoint tests one point per column; subpixel sampling is an antialiasing technique. 🛠 fixed: a student file says T.", "src": "G15 T/F"}, {"id": "615b4d5e23", "t": "fill", "q": "T/F: To test whether a point is inside a figure, count how many times a ray from the point to infinity crosses the boundary.", "a": "✅ TRUE. Odd = inside, even = outside.", "src": "G15 T/F"}, {"id": "3e15cc5de6", "t": "clip", "q": "T/F: On raster devices, segments can be clipped during conversion (while drawing).", "a": "✅ TRUE. Each generated pixel is tested against the window.", "src": "G15 T/F"}, {"id": "6b31c83e08", "t": "clip", "q": "T/F: Clipping during conversion is efficient when most of the segment lies outside the window.", "a": "❌ FALSE. You'd generate many pixels just to throw them away.", "src": "G15 T/F"}, {"id": "dc3698a625", "t": "line", "q": "Bresenham (2,2)–(8,5): pixels?", "a": "Δx = 6, Δy = 3, p₀ = 0 → **(2,2) (3,3) (4,3) (5,4) (6,4) (7,5) (8,5)**.", "src": "G15 T/F"}, {"id": "4db29c1c36", "t": "line", "q": "Bresenham (2,3)–(4,8) (steep): pixels?", "a": "Step along y, p₀ = −1 → **(2,3) (2,4) (3,5) (3,6) (4,7) (4,8)**.", "src": "G15 T/F"}, {"id": "6f29d18a9d", "t": "fill", "q": "Midpoint circle r = 8 (from (0,8), p₀ = 5/4 − r): 4th pixel, and its 7 symmetric partners?", "a": "(0,8) (1,8) (2,8) **(3,7)**. Partners: (3,−7) (−3,7) (−3,−7) (7,3) (7,−3) (−7,3) (−7,−3).", "src": "G15 T/F"}, {"id": "86b4571d2e", "t": "line", "q": "Two-pixel antialiasing of A(2,1)–B(6,4): brightness in column 3?", "a": "True y = 1.75 → **(3,2) 75 %, (3,1) 25 %**.", "src": "G15 T/F"}, {"id": "7b71136fdd", "t": "line", "q": "Two-pixel antialiasing of A(0,1)–B(5,3): brightness in column 2?", "a": "True y = 1.8 → **(2,2) 80 %, (2,1) 20 %**.", "src": "G15 T/F"}, {"id": "c8153d163c", "t": "line", "q": "Two-pixel antialiasing of A(2,1)–B(6,3): which pixels and how bright?", "a": "(2,1) (4,2) (6,3) at **100 %** (the line hits their centres); (3,1)+(3,2) and (5,2)+(5,3) at **50 %** each.", "src": "G15 T/F"}, {"id": "183e2c3ba6", "t": "xf", "q": "T/F: When composing transforms, the order of the matrix product can't be arbitrary.", "a": "✅ TRUE. Matrix products don't commute (T·R ≠ R·T).", "src": "G15 T/F"}, {"id": "678c0cbc51", "t": "xf", "q": "T/F: Geometric transforms are applied to the vertices (not the edges).", "a": "✅ TRUE. Transform the vertices, then redraw the edges.", "src": "G15 T/F"}, {"id": "1b9be661aa", "t": "xf", "q": "T/F: The third homogeneous coordinate (2D) should be 1.", "a": "✅ TRUE for normalised coordinates. If you get (x′, y′, w), divide by w. (Versions saying \"1/2\" or \"2\": FALSE.)", "src": "G15 T/F"}, {"id": "1614fb9862", "t": "xf", "q": "T/F: The unit square scaled by (2,3) and moved by [2,3] has a vertex at (2,5).", "a": "❌ FALSE. The vertices are (2,3), (4,3), (4,6), (2,6).", "src": "G15 T/F"}, {"id": "0f753e633e", "t": "xf", "q": "T/F: Scaling A(0,0) B(0,1) C(1,1) D(1,0) by sx = 2, sy = 4 gives a vertex (2,1).", "a": "❌ FALSE. You get (0,0), (0,4), (2,4), (2,0).", "src": "G15 T/F"}, {"id": "5ca4257ec7", "t": "xf", "q": "T/F: The homogeneous point (5,4,3,1) has xyz coordinates (5,4,3,1).", "a": "❌ FALSE. It's **(5,4,3)**. The 4th coordinate is w.", "src": "G15 T/F"}, {"id": "a44e809119", "t": "xf", "q": "T/F: The point (3,4,5) has homogeneous coordinates (3/5, 4/5, 1).", "a": "❌ FALSE. It's (3,4,5,1) (or any multiple). Dividing by z is perspective.", "src": "G15 T/F"}, {"id": "0928172588", "t": "fill", "q": "T/F: The point (2,3,1) is a 2D point in Cartesian coordinates.", "a": "❌ FALSE. It's the homogeneous form of the 2D point (2,3), or a 3D Cartesian point.", "src": "G15 T/F"}, {"id": "868bf9a8e0", "t": "xf", "q": "T/F: The scaling centre must be the origin.", "a": "❌ FALSE ⚠️. The basic S(sx,sy) scales about the origin, but you can scale about any point with T(p)·S·T(−p). (The zdaj.se bank says TRUE, thinking of the basic matrix.)", "src": "G15 T/F"}, {"id": "4f8d1bf7bd", "t": "xf", "q": "T/F: Rotations are allowed rigid-body transforms.", "a": "✅ TRUE (rigid = rotation + translation).", "src": "G15 T/F"}, {"id": "f6d2c0309e", "t": "xf", "q": "T/F: A rigid-body transform can't contain a rotation matrix.", "a": "❌ FALSE.", "src": "G15 T/F"}, {"id": "9467836206", "t": "xf", "q": "T/F: Parallel projection can be written as a matrix in homogeneous coordinates.", "a": "✅ TRUE.", "src": "G15 T/F"}, {"id": "05b252fbfe", "t": "clip", "q": "T/F: Line clipping algorithms have a first stage that quickly eliminates (rejects) segments.", "a": "✅ TRUE. Cohen–Sutherland's AND ≠ 0 test.", "src": "G15 T/F"}, {"id": "b1a990868c", "t": "clip", "q": "T/F: The first phase of Cohen–Sutherland eliminates all segments that lie completely outside the window.", "a": "❌ FALSE. A segment crossing a corner region (e.g. codes 1000 and 0010) has AND = 0 but may still miss the window. It's rejected only after clipping.", "src": "G15 T/F"}, {"id": "97b82f91ac", "t": "clip", "q": "T/F: In Cohen–Sutherland's second phase, segments are clipped against the four window-edge lines in turn.", "a": "✅ TRUE.", "src": "G15 T/F"}, {"id": "7b110d1e69", "t": "clip", "q": "T/F: Sutherland–Hodgman clips the polygon against the window's edge lines one after another.", "a": "✅ TRUE.", "src": "G15 T/F"}, {"id": "19910d3e59", "t": "clip", "q": "T/F: On vector devices, segments can be clipped during conversion (while drawing).", "a": "✅ TRUE (clipping \"during drawing\" is one of the three places to clip).", "src": "G15 T/F"}, {"id": "8dfbdbb012", "t": "clip", "q": "Steps of Cohen–Sutherland?", "a": "1) 4-bit code for each end [above, below, right, left]. 2) Both 0000 → accept. 3) AND ≠ 0 → reject. 4) Otherwise clip an outside end at the edge of a set bit, recompute its code, and repeat.", "src": "G15 T/F"}, {"id": "f8871c5237", "t": "clip", "q": "Sutherland–Hodgman: the 4 cases for an edge S→P against one clip line?", "a": "in→in: output P. in→out: output the intersection. out→in: output the intersection **and** P. out→out: output nothing.", "src": "G15 T/F"}, {"id": "815c09176d", "t": "xf", "q": "T/F: In a rotation, the fixed point must be the origin.", "a": "❌ FALSE. Rotate about p with T(p)·R·T(−p). (Only the bare R matrix uses the origin.) 🛠 fixed: student files say T.", "src": "G15 T/F"}, {"id": "acb107848a", "t": "xf", "q": "T/F: The point P(2,8) has homogeneous coordinates (1/2, 1/8).", "a": "❌ FALSE. (2, 8, 1), or any multiple such as (4, 16, 2).", "src": "G15 T/F"}, {"id": "b083a7faa8", "t": "clip", "q": "T/F: Cohen–Sutherland is efficient when most segments lie inside (or wholly on one side outside) the window.", "a": "✅ TRUE ⚠️. Those are trivially accepted or rejected by the codes, with no intersection maths.", "src": "G15 T/F"}, {"id": "5cd6f261b6", "t": "clip", "q": "T/F: Clipping a convex polygon with a rectangle can give several convex polygons.", "a": "❌ FALSE. Convex ∩ convex is **one** convex polygon. (A concave polygon can split.)", "src": "G15 T/F"}, {"id": "cac828e622", "t": "clip", "q": "T/F: The first step of Sutherland–Hodgman is computing 4-bit codes of the vertices.", "a": "❌ FALSE. The 4-bit codes belong to Cohen–Sutherland; S–H tests vertices against one edge at a time.", "src": "G15 T/F"}, {"id": "214c2914a7", "t": "xf", "q": "Shear `SH = [[1,½,0],[½,1,0],[0,0,1]]` applied to the unit square?", "a": "(0,0) → **(0,0)**, (1,0) → **(1, 0.5)**, (1,1) → **(1.5, 1.5)**, (0,1) → **(0.5, 1)**: a rhombus along y = x.", "src": "G15 T/F"}, {"id": "4a04a74a63", "t": "xf", "q": "Segment EF is transformed by `M = [[1,−2,0],[2,1,1],[0,0,1]]`, then translated by (1,1). Compound matrix and E″, F″ for E(0,1), F(4,1)?", "a": "T·M = `[[1,−2,1],[2,1,2],[0,0,1]]` → **E″(−1, 3), F″(3, 11)**.", "src": "G15 T/F"}, {"id": "68a5a2f074", "t": "xf", "q": "Point (1,2): rotate 90° about the origin, translate (2,1), scale ×2 along y. Result and compound matrix?", "a": "(−2,1) → (0,2) → **(0,4)**; S·T·R = `[[0,−1,2],[2,0,2],[0,0,1]]`.", "src": "G15 T/F"}, {"id": "ac840f3d06", "t": "xf", "q": "Triangle A(2,2) B(4,3) C(3,5): translate (3,4), scale (2, ½), rotate 90° (all about the origin). Result?", "a": "**A(−3,10), B(−3.5,14), C(−4.5,12)**; R·S·T = `[[0,−0.5,−2],[2,0,6],[0,0,1]]`.", "src": "G15 T/F"}, {"id": "194707af24", "t": "bez", "q": "T/F: The number of control points determines the degree of the Bézier polynomial.", "a": "✅ TRUE. n points → degree **n − 1**.", "src": "G15 T/F"}, {"id": "87164329b6", "t": "bez", "q": "T/F: The order (numbering) of the control points matters.", "a": "✅ TRUE. A different order gives a different curve.", "src": "G15 T/F"}, {"id": "3053b6d07a", "t": "bez", "q": "T/F: de Casteljau's algorithm builds points of the curve geometrically.", "a": "✅ TRUE (repeated linear interpolation).", "src": "G15 T/F"}, {"id": "ce3a636d19", "t": "bez", "q": "T/F: A Bézier curve always passes through its first and last control points.", "a": "✅ TRUE.", "src": "G15 T/F"}, {"id": "0934f2fe80", "t": "bez", "q": "T/F: A Bézier curve lies inside the convex hull of its control points.", "a": "✅ TRUE.", "src": "G15 T/F"}, {"id": "3291bc5c18", "t": "bez", "q": "T/F: A Bézier segment with 4 control points can be a closed curve.", "a": "✅ TRUE (P₀ = P₃).", "src": "G15 T/F"}, {"id": "a3792bf981", "t": "bez", "q": "T/F: A degree-2 parametric curve can be a straight segment.", "a": "✅ TRUE (collinear control points).", "src": "G15 T/F"}, {"id": "e54517d2d9", "t": "bez", "q": "T/F: A B-spline does not (in general) pass through its first control point.", "a": "✅ TRUE (uniform B-spline).", "src": "G15 T/F"}, {"id": "989215a82b", "t": "bez", "q": "T/F: Joining Bézier curves, you can get C³ continuity at the joint.", "a": "⚠️ TRUE in theory (match more derivatives) but unusual: in practice you aim for G¹/C¹ (and C² with B-splines).", "src": "G15 T/F"}, {"id": "153a377f88", "t": "bez", "q": "Bézier P0(2,1) P1(3,3) P2(5,3) P3(3,2): point at u = 0.5? Is (0,2) or (2,0) on the curve? Is any point of P2P3 on it?", "a": "u = 0.5 → **(3.625, 2.625)** (not (2,2) or (1,2)). (0,2) no (x ≥ 2 on the curve), (2,0) no (y ≥ 1). **Yes**: P3 is on both.", "src": "G15 T/F"}, {"id": "841437a4a3", "t": "bez", "q": "T/F: The motion path of a point can be described with a Bézier curve.", "a": "✅ TRUE.", "src": "G15 T/F"}, {"id": "3910298d40", "t": "bez", "q": "T/F: G¹ continuity = the same tangent direction at the joint; C¹ = the same direction and length.", "a": "✅ TRUE. Make P₂, P₃ = Q₀ and Q₁ collinear (C¹: also |P₃P₂| = |Q₀Q₁|).", "src": "G15 T/F"}, {"id": "905299c27f", "t": "bez", "q": "T/F: Bézier curves are parametric curves.", "a": "✅ TRUE. P(t), t ∈ [0,1].", "src": "G15 T/F"}, {"id": "c871213e42", "t": "bez", "q": "T/F: The first 3 control points must be collinear.", "a": "❌ FALSE. Only needed for a smooth join with another curve.", "src": "G15 T/F"}, {"id": "857c924254", "t": "bez", "q": "T/F: Moving any control point changes the shape of the whole curve.", "a": "✅ TRUE (global control; every Bernstein weight is > 0 for 0 < t < 1).", "src": "G15 T/F"}, {"id": "24f91a1a48", "t": "bez", "q": "T/F: A Bézier curve passes through its second control point.", "a": "❌ FALSE. Only through the first and the last.", "src": "G15 T/F"}, {"id": "b62a363be1", "t": "bez", "q": "Can (1,4) lie on the Bézier curve P0(2,2) P1(3,5) P2(6,6) P3(4,3)?", "a": "**No.** The curve stays inside the convex hull, whose x runs only from 2 to 6. (Its points: t = ½ → (4.13, 4.75).)", "src": "G15 T/F"}, {"id": "2ad68a02c4", "t": "bez", "q": "Bézier P0(0,3) P1(3,0) P2(3,6) P3(6,3): points at t = ¼, ½, ¾?", "a": "**(1.78, 2.16), (3, 3), (4.22, 3.84)**: an S shape.", "src": "G15 T/F"}, {"id": "b829985336", "t": "img", "q": "What is a pixel?", "a": "A digital sample of the image: a grid node with a value (colour). It has a position, not a size. The display gives it a size.", "src": "G15 explain"}, {"id": "7ab78576cb", "t": "img", "q": "Sampling vs quantisation?", "a": "Sampling: put a grid on the image and take one value per node (where). Quantisation: round each value to the nearest allowed level (which values), set by the bits per sample.", "src": "G15 explain"}, {"id": "4823ed75d8", "t": "col", "q": "What are monochromatic colours?", "a": "Colours of light with a **single wavelength** (the spectral colours on the horseshoe edge).", "src": "G15 explain"}, {"id": "3d6defdeed", "t": "col", "q": "What are metamers?", "a": "Different light spectra that the eye sees as the **same colour** (3 cone types → many spectra map to one sensation).", "src": "G15 explain"}, {"id": "44a07713db", "t": "col", "q": "Why is RGB in graphics \"discrete\"?", "a": "Each channel is a finite word (8 bits → 256 levels). With 24 bits there are 2²⁴ ≈ 16.7 M colours, a finite set.", "src": "G15 explain"}, {"id": "dd56afe1e3", "t": "col", "q": "Can R, G, B primaries produce every visible colour?", "a": "No. No three real primaries cover the whole chromaticity horseshoe. Only CIE XYZ (imaginary primaries) does.", "src": "G15 explain"}, {"id": "da28757abb", "t": "bez", "q": "Discuss the chromaticity diagram.", "a": "It's the xy slice of CIE XYZ at fixed luminance. The curved edge holds the saturated spectral colours (nm marked), the straight bottom the purples, white is near (⅓, ⅓), unsaturated colours inside. Mixes lie on segments between colours. A device gamut is a triangle.", "src": "G15 explain"}, {"id": "b55384f1a7", "t": "col", "q": "What is colour management for?", "a": "Device profiles + conversions through a device-independent space (e.g. L*a*b*), so a colour looks the same on different screens and printers, within each device's gamut.", "src": "G15 explain"}, {"id": "5ef82e2c3f", "t": "img", "q": "Raster vs vector graphics?", "a": "Raster: a pixel map, fixed resolution, enlarging shows aliasing. Vector: objects from vertices/control points, little memory, each object independent, scales perfectly (rasterised at the final resolution).", "src": "G15 explain"}, {"id": "80e9cf85e6", "t": "col", "q": "How does raster display work?", "a": "Pixels are read from the frame buffer and shown row by row, left to right. Each pixel = three sub-dots R, G, B that blend at a distance (CRT phosphor triads, LCD cells with filters, OLED diodes).", "src": "G15 explain"}, {"id": "2545b95a43", "t": "xf", "q": "Explain the double frame buffer.", "a": "While buffer A is displayed, the next frame is drawn into buffer B. When both are done, they swap (ping-pong), so you never see a half-drawn frame.", "src": "G15 explain"}, {"id": "2e558a93ca", "t": "xf", "q": "Explain homogeneous coordinates.", "a": "Add one coordinate: (x, y) → (x, y, 1). Then translation becomes a matrix product like rotation and scaling, so any chain of transforms is one matrix. If w ≠ 1 after computing, divide by w.", "src": "G15 explain"}, {"id": "281d7969a0", "t": "bez", "q": "Properties of Bézier curves?", "a": "Defined by control points, degree = points − 1. Passes through the first and last points. Tangent to P₀P₁ at the start and to P₂P₃ at the end. Inside the convex hull. Can be closed or a straight line. Moving one point changes the whole curve.", "src": "G15 explain"}];</script>
<script>/* GRK Test 1 trainer — UI. Depends on window.GRK (engine), TOPICS, TASKS, EXTRA_CARDS, VAULT_CARDS. */
(function () {
  'use strict';
  const G = window.GRK, $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const TEST = new Date('2026-11-13T08:30:00+01:00');
  const TOPIC = Object.fromEntries(TOPICS.map((t) => [t.id, t]));
  const DAY = 864e5;
  const HOSTED = /github\.io$/.test(location.hostname);

  /* ---------------- cards ---------------- */
  const hash = (s) => { let h = 2166136261; for (const c of s) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); };
  const CARDS = [...VAULT_CARDS.map((c) => ({ ...c })), ...EXTRA_CARDS.map((c) => ({ ...c, id: 'x' + hash(c.q), src: 'Trainer' }))];
  CARDS.forEach((c) => { c.tf = /^T\/F/.test(c.q); });

  /* ---------------- storage (db per user, localStorage mirror) ---------------- */
  const LS = 'grk-t1-state';
  let state = { srs: {}, mocks: [], sprint: {}, last: null };
  try { const s = JSON.parse(localStorage.getItem(LS) || 'null'); if (s && s.srs) state = Object.assign(state, s); } catch (e) { /* storage blocked */ }
  let dbDoc = null, saveTimer = null;
  const setSync = (t) => { const el = $('#sync'); if (el) el.textContent = t; };
  function persist() {
    try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) { /* ignore */ }
    if (!dbDoc) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { dbDoc.set({ srs: state.srs, mocks: state.mocks.slice(-30), sprint: state.sprint || {}, last: Date.now() }).then(() => setSync('progress: saved to your account')).catch(() => setSync('progress: this device only')); }, 1200);
  }
  (async () => {
    if (!window.claude || !window.claude.use) return;
    try {
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;
      const uid = await user.id(); if (!uid) return;
      dbDoc = db.doc('data/users/' + uid + '/grk/test1');
      const snap = await dbDoc.get();
      if (snap.exists) {
        const d = snap.data() || {};
        const remote = d.srs || {};
        // merge: keep the more recently reviewed entry per card
        Object.keys(remote).forEach((k) => { const l = state.srs[k]; if (!l || (remote[k][2] || 0) > (l[2] || 0)) state.srs[k] = remote[k]; });
        if (Array.isArray(d.mocks) && d.mocks.length > state.mocks.length) state.mocks = d.mocks;
        if (d.sprint && typeof d.sprint === 'object') state.sprint = Object.assign({}, d.sprint, state.sprint || {});
      }
      setSync('progress: saved to your account');
      persist(); render();
    } catch (e) { setSync('progress: this device only'); }
  })();

  /* SRS: state.srs[id] = [box, dueMs, lastMs]. Boxes give 1, 2, 4 days; capped to come back before the test. */
  const INTERVALS = [0, 1, 2, 4, 7];
  const isDue = (id, now = Date.now()) => { const s = state.srs[id]; return !s || s[1] <= now; };
  const isNew = (id) => !state.srs[id];
  function grade(id, g) {
    const now = Date.now(), s = state.srs[id] || [0, 0, 0];
    let box = s[0];
    if (g === 'again') box = 0; else if (g === 'good') box = Math.min(box + 1, 4); else box = Math.min(box + 2, 4);
    let due = g === 'again' ? now + 60e3 : now + INTERVALS[box] * DAY - 3 * 3600e3;
    const cap = TEST.getTime() - 20 * 3600e3; // last review the day before
    if (now < cap && due > cap && box < 4) due = cap;
    state.srs[id] = [box, due, now];
    persist();
  }

  /* ---------------- figures (SVG strings) ---------------- */
  const F = {};
  const svg = (w, h, body, label) => `<svg class="svgc" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${esc(label || 'diagram')}">${body}</svg>`;
  const T = (x, y, s, cls = 'lt', anchor = 'middle') => `<text x="${x}" y="${y}" class="${cls}" text-anchor="${anchor}">${esc(s)}</text>`;
  F.pipeline = (q) => {
    const st = ['Vertex shader', 'Primitive assembly + clip/cull', q ? '?' : 'Rasterization', 'Fragment shader', 'Depth test + blend', 'Frame buffer'];
    let b = ''; const w = 120, h = 54;
    st.forEach((s, i) => { const x = 8 + (i % 3) * 138, y = 8 + Math.floor(i / 3) * 86; const prog = i === 0 || i === 3;
      b += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" class="${prog ? 'softF' : 'paperF'}" stroke="currentColor" stroke-width="1.5"/>`;
      const words = s.split(' '); const l1 = words.slice(0, 2).join(' '), l2 = words.slice(2).join(' ');
      b += T(x + w / 2, y + (l2 ? 24 : 32), l1) + (l2 ? T(x + w / 2, y + 40, l2) : '');
      if (i % 3 < 2 && i < 5) b += `<path d="M${x + w + 2} ${y + h / 2} h14" class="ink"/><path d="M${x + w + 16} ${y + h / 2} l-5 -4 v8z" fill="currentColor"/>`; });
    b += `<path d="M${8 + 2 * 138 + 60} ${62} v10 H${68} v14" class="ink"/><path d="M68 ${94} l-4 -6 h8z" fill="currentColor"/>`;
    b += T(214, 168, 'shaded = programmable on the GPU', 'lb');
    return svg(420, 176, b, 'graphics pipeline');
  };
  F['pipeline-q'] = () => F.pipeline(true);
  F.righthand = () => {
    const o = [90, 110]; let b = '';
    b += `<path d="M90 110 h110" class="penS"/><path d="M90 110 v-90" class="okS"/><path d="M90 110 l-60 45" class="markS"/>`;
    b += T(212, 114, 'x', 'lt', 'start') + T(90, 14, 'y') + T(22, 168, 'z (toward you)', 'lt', 'start');
    b += T(230, 60, 'x × y = z', 'lt', 'start') + T(230, 80, 'y × z = x', 'lt', 'start') + T(230, 100, 'z × x = y', 'lt', 'start') + T(230, 128, 'b × a = −(a × b)', 'lb', 'start');
    return svg(360, 180, b, 'right-handed axes');
  };
  F.rgbcube = () => {
    const P = (x, y, z) => [160 + x * 130 - z * 55, 160 - y * 120 + z * 40];
    const V = { K: [0, 0, 0], R: [1, 0, 0], G: [0, 1, 0], B: [0, 0, 1], Y: [1, 1, 0], C: [0, 1, 1], M: [1, 0, 1], W: [1, 1, 1] };
    const E = [['K', 'R'], ['K', 'G'], ['K', 'B'], ['R', 'Y'], ['R', 'M'], ['G', 'Y'], ['G', 'C'], ['B', 'C'], ['B', 'M'], ['Y', 'W'], ['C', 'W'], ['M', 'W']];
    const fill = { K: '#000', R: '#f00', G: '#0f0', B: '#00f', Y: '#ff0', C: '#0ff', M: '#f0f', W: '#fff' };
    const name = { K: 'black (0,0,0)', R: 'red (1,0,0)', G: 'green (0,1,0)', B: 'blue (0,0,1)', Y: 'yellow (1,1,0)', C: 'cyan (0,1,1)', M: 'magenta (1,0,1)', W: 'white (1,1,1)' };
    let b = E.map(([a, c]) => { const p = P(...V[a]), q = P(...V[c]); return `<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" class="gl" stroke-width="1.5"/>`; }).join('');
    const k = P(0, 0, 0), w = P(1, 1, 1); b += `<line x1="${k[0]}" y1="${k[1]}" x2="${w[0]}" y2="${w[1]}" class="ax dash"/>`;
    Object.entries(V).forEach(([n, v]) => { const p = P(...v); const right = v[0] === 1;
      b += `<circle cx="${p[0]}" cy="${p[1]}" r="7" fill="${fill[n]}" stroke="currentColor" stroke-width="1.2"/>` + T(p[0] + (right ? 12 : -12), p[1] + 4, name[n], 'lb', right ? 'start' : 'end'); });
    b += T(205, 232, 'grey diagonal: black → white (dashed)', 'lb');
    return svg(410, 240, b, 'RGB cube');
  };
  F.hsvcone = () => {
    let b = `<ellipse cx="150" cy="50" rx="110" ry="28" class="softF" stroke="currentColor" stroke-width="1.5"/>`;
    b += `<path d="M40 50 L150 210 L260 50" class="ink"/><line x1="150" y1="50" x2="150" y2="210" class="ax dash"/>`;
    const hues = [['R 0°', 260, 50, '#f00'], ['Y 60°', 205, 74, '#ff0'], ['G 120°', 95, 74, '#0f0'], ['C 180°', 40, 50, '#0ff'], ['B 240°', 95, 26, '#00f'], ['M 300°', 205, 26, '#f0f']];
    hues.forEach(([n, x, y, c]) => { b += `<circle cx="${x}" cy="${y}" r="6" fill="${c}" stroke="currentColor"/>` + T(x + (x >= 150 ? 10 : -10), y + 4, n, 'lb', x >= 150 ? 'start' : 'end'); });
    b += `<circle cx="150" cy="50" r="5" fill="#fff" stroke="currentColor"/>` + T(158, 46, 'white', 'lb', 'start');
    b += `<circle cx="150" cy="210" r="5" fill="#000" stroke="currentColor"/>` + T(160, 214, 'black (V = 0)', 'lb', 'start');
    b += T(158, 140, 'greys on the axis (S = 0)', 'lb', 'start') + T(150, 236, 'V = height · S = distance from axis · H = angle', 'lb');
    return svg(300, 245, b, 'HSV cone');
  };
  F.cie = () => {
    let b = `<path d="M60 200 C 40 120, 60 40, 120 20 C 170 10, 230 60, 270 140 L 60 200 Z" class="softF" stroke="currentColor" stroke-width="1.5"/>`;
    b += T(55, 214, '400 nm', 'lb') + T(120, 14, '520 nm', 'lb') + T(285, 145, '700 nm', 'lb', 'start') + T(170, 190, 'purple line', 'lb');
    b += `<line x1="110" y1="90" x2="220" y2="130" class="penS"/><circle cx="110" cy="90" r="6" class="mark"/><circle cx="220" cy="130" r="6" class="mark"/>`;
    b += T(98, 86, '1', 'lt', 'end') + T(232, 134, '2', 'lt', 'start') + T(165, 100, 'mixes', 'lb');
    b += `<circle cx="150" cy="140" r="4" fill="#fff" stroke="currentColor"/>` + T(158, 154, 'white ≈ (⅓, ⅓)', 'lb', 'start');
    return svg(320, 225, b, 'chromaticity diagram');
  };

  // generic pixel-grid plotter (cells = pixels, centres at integer coords)
  function grid(x0, x1, y0, y1, draw, maxW = 420) {
    const nx = x1 - x0 + 1, ny = y1 - y0 + 1, s = Math.max(10, Math.min(36, Math.floor(maxW / (nx + 1))));
    const W = (nx + 1) * s, H = (ny + 1) * s;
    const X = (x) => (x - x0 + 1) * s + s / 2 - s / 2 + s / 2, Y = (y) => (y1 - y) * s + s / 2;
    let b = '';
    for (let i = 0; i <= nx; i++) b += `<line x1="${s + i * s}" y1="0" x2="${s + i * s}" y2="${ny * s}" class="gl"/>`;
    for (let j = 0; j <= ny; j++) b += `<line x1="${s}" y1="${j * s}" x2="${W}" y2="${j * s}" class="gl"/>`;
    const step = nx > 24 ? 5 : nx > 14 ? 2 : 1;
    for (let x = x0; x <= x1; x++) if ((x - x0) % step === 0) b += T(X(x), ny * s + s * 0.7, x, 'lb');
    for (let y = y0; y <= y1; y++) if ((y - y0) % (ny > 24 ? 5 : ny > 14 ? 2 : 1) === 0) b += T(s * 0.55, Y(y) + 4, y, 'lb');
    const ctx = { s, X, Y, cell: (x, y, cls, op = 1) => `<rect x="${X(x) - s / 2 + 1}" y="${Y(y) - s / 2 + 1}" width="${s - 2}" height="${s - 2}" class="${cls}" fill-opacity="${op}"/>`,
      seg: (a, c, cls) => `<line x1="${X(a[0])}" y1="${Y(a[1])}" x2="${X(c[0])}" y2="${Y(c[1])}" class="${cls}"/>`,
      dot: (p, cls, r = 4) => `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="${r}" class="${cls}"/>`,
      txt: (p, t, cls = 'lt') => T(X(p[0]), Y(p[1]) + 4, t, cls) };
    b += draw(ctx);
    return svg(W, H + s, b, 'pixel grid');
  }
  F.bres = () => grid(0, 5, 0, 3, (c) => G.bresenham({ x0: 0, y0: 0, x1: 5, y1: 2 }).draw.pts.map((p) => c.cell(p[0], p[1], 'pen', 0.8)).join('') + c.seg([0, 0], [5, 2], 'markS'), 260);
  F.aa = () => grid(0, 5, 0, 3, (c) => G.antialias({ x0: 0, y0: 0, x1: 5, y1: 2 }).draw.cells.map(([x, y, w]) => c.cell(x, y, 'pen', 0.15 + 0.85 * w)).join('') + c.seg([0, 0], [5, 2], 'markS'), 260);
  F.octants = () => { const d = G.circle({ r: 8 }).draw; return grid(-9, 9, -9, 9, (c) => d.all.map((p) => c.cell(p[0], p[1], 'pen', 0.35)).join('') + d.oct.map((p) => c.cell(p[0], p[1], 'pen', 1)).join('') + `<circle cx="${c.X(0)}" cy="${c.Y(0)}" r="${8 * c.s}" class="markS"/>`, 300); };
  F.bary = () => grid(0, 5, 0, 5, (c) => `<polygon points="${[[0, 0], [0, 4], [4, 0]].map((p) => c.X(p[0]) + ',' + c.Y(p[1])).join(' ')}" class="softF" stroke="currentColor" stroke-width="2"/>` + c.cell(1, 2, 'okF', 0.8) + c.txt([0, 0], 'A') + c.txt([0, 4], 'B') + c.txt([4, 0], 'C') + c.txt([2.3, 2.6], 'α=.25 β=.5 γ=.25', 'lb'), 240);
  F.scan = () => { const d = G.scanline({ verts: [[1, 1], [9, 3], [4, 8]] }).draw; return grid(0, 10, 0, 9, (c) => d.spans.map(([y, sp]) => sp.map(([a, b2]) => { let r = ''; for (let x = a; x <= b2; x++) r += c.cell(x, y, 'pen', 0.45); return r; }).join('')).join('') + `<polygon points="${d.verts.map((p) => c.X(p[0]) + ',' + c.Y(p[1])).join(' ')}" class="markS"/>` + c.seg([0, 5], [10, 5], 'okS dash'), 300); };
  F.flood = () => { const r = G.floodFill({ grid: ['######', '###..#', '#....#', '#..#.#', '####.#', '######'], seed: [1, 2] }); return grid(0, 5, 0, 5, (c) => { let b2 = ''; ['######', '###..#', '#....#', '#..#.#', '####.#', '######'].forEach((row, i) => row.split('').forEach((ch, x) => { if (ch === '#') b2 += c.cell(x, 5 - i, 'ink', 0.85); })); r.draw.seq.forEach((p, i) => { b2 += c.cell(p[0], p[1], 'pen', 0.25) + c.txt(p, i + 1); }); return b2; }, 240); };
  F.bilinear = () => {
    let b = '';
    const P = [[60, 40, 'A=30'], [200, 40, 'B=50'], [60, 160, 'E=45'], [200, 160, 'F=60']];
    P.forEach(([x, y, n]) => { b += `<rect x="${x - 40}" y="${y - 30}" width="80" height="60" class="paperF" stroke="currentColor"/><circle cx="${x}" cy="${y}" r="4" fill="currentColor"/>` + T(x, y - 10, n, 'lb'); });
    const nx = 60 + 0.75 * 140, ny = 40 + 0.75 * 120;
    b += `<line x1="60" y1="40" x2="200" y2="40" class="penS"/><line x1="60" y1="160" x2="200" y2="160" class="penS"/><line x1="${nx}" y1="40" x2="${nx}" y2="160" class="okS dash"/>`;
    b += `<circle cx="${nx}" cy="40" r="5" class="pen"/><circle cx="${nx}" cy="160" r="5" class="pen"/><circle cx="${nx}" cy="${ny}" r="6" class="mark"/>`;
    b += T(nx + 8, 56, 'P1', 'lt', 'start') + T(nx + 8, 178, 'P2', 'lt', 'start') + T(nx + 10, ny + 4, 'N', 'lt', 'start') + T(130, 210, 'α = 0.75 → , β = 0.75 ↓', 'lb');
    return svg(270, 220, b, 'bilinear interpolation');
  };
  F.outcodes = () => {
    let b = ''; const xs = [10, 90, 210, 290], ys = [10, 70, 160, 220];
    const codes = [['1001', '1000', '1010'], ['0001', '0000', '0010'], ['0101', '0100', '0110']];
    for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) { const x = xs[c], y = ys[r], w = xs[c + 1] - x, h = ys[r + 1] - y;
      b += `<rect x="${x}" y="${y}" width="${w}" height="${h}" class="${r === 1 && c === 1 ? 'softF' : 'paperF'}" stroke="currentColor" stroke-width="${r === 1 && c === 1 ? 2.5 : 1}"/>` + `<text x="${x + w / 2}" y="${y + h / 2 + 5}" class="lt" text-anchor="middle" style="font-family:var(--font-mono)">${codes[r][c]}</text>`; }
    b += T(150, 240, 'bits: Top Bottom Right Left (TBRL)', 'lb');
    return svg(300, 248, b, 'Cohen-Sutherland outcodes');
  };
  F.sh = () => {
    let b = '';
    const cases = [['out → in', 'P, W', 1, 0], ['in → in', 'W', 0, 0], ['in → out', 'P', 0, 1], ['out → out', 'nothing', 1, 1]];
    cases.forEach(([n, o, s, w], i) => { const x0 = 10 + i * 95; b += `<line x1="${x0 + 50}" y1="10" x2="${x0 + 50}" y2="120" class="ink"/>` + T(x0 + 25, 22, 'in', 'lb') + T(x0 + 75, 22, 'out', 'lb');
      const sx = s ? x0 + 78 : x0 + 22, wx = w ? x0 + 78 : x0 + 22; b += `<line x1="${sx}" y1="40" x2="${wx}" y2="100" class="penS"/><circle cx="${sx}" cy="40" r="4" fill="currentColor"/><circle cx="${wx}" cy="100" r="5" class="pen"/>` + T(sx, 36, 'S', 'lb') + T(wx, 116, 'W', 'lb');
      if (s !== w) b += `<circle cx="${x0 + 50}" cy="70" r="5" class="mark"/>` + T(x0 + 58, 66, 'P', 'lb', 'start');
      b += T(x0 + 48, 140, n, 'lt') + T(x0 + 48, 158, '→ ' + o, 'lb'); });
    return svg(390, 168, b, 'Sutherland-Hodgman cases');
  };
  F.decast = () => {
    const pts = [[1, 1], [4, 8], [10, 1]], t = 0.5, L = G.deCasteljau(pts, t);
    const X = (x) => 20 + x * 26, Y = (y) => 220 - y * 24;
    let b = `<polyline points="${pts.map((p) => X(p[0]) + ',' + Y(p[1])).join(' ')}" class="ink dash"/>`;

    flood: { name: 'Seed fill order', t: 'fill', f: [['grid', 'grid rows, top row first (# = border, . = empty)', '######\n###..#\n#....#\n#..#.#\n####.#\n######', 'area'], ['seed', 'seed x,y', '1,2', 'text'], ['order', 'call order', 'LRUD', 'sel', ['LRUD', 'RLUD', 'LRDU', 'UDLR', 'DULR', 'URDL']], ['conn', 'connectivity', '4', 'sel', ['4', '8']]], run: (v) => G.floodFill({ grid: v.grid.trim().split('\n').map((s) => s.trim()), seed: nums(v.seed), order: v.order, conn: Number(v.conn) }), rnd: () => { const W = 7, H = 6; const rows = []; for (let i = 0; i < H; i++) { let r = ''; for (let x = 0; x < W; x++) r += (i === 0 || i === H - 1 || x === 0 || x === W - 1 || Math.random() < 0.22) ? '#' : '.'; rows.push(r); } const free = []; rows.forEach((r, i) => r.split('').forEach((ch, x) => { if (ch === '.') free.push([x, H - 1 - i]); })); if (!free.length) { rows[2] = '#.....#'; free.push([1, 3]); } const sd = pick(free); return { grid: rows.join('\n'), seed: sd.join(','), order: pick(['LRUD', 'LRUD', 'RLUD']), conn: '4' }; } },

  function parseOps(text) {
    return text.trim().split('\n').map((l) => l.trim().split(/[\s,]+/)).filter((a) => a[0]).map(([k, ...a]) => { const n = a.map(Number); k = k.toUpperCase();
      if (k === 'T') return { type: 'T', dx: n[0], dy: n[1] };
      if (k === 'S') return { type: 'S', sx: n[0], sy: n[1], about: n.length >= 4 ? [n[2], n[3]] : null };
      if (k === 'R') return { type: 'R', deg: n[0], about: n.length >= 3 ? [n[1], n[2]] : null };
      if (k === 'SH') return { type: 'Sh', shx: n[0], shy: n[1] };
      if (k === 'MX') return { type: 'Mx' }; if (k === 'MY') return { type: 'My' };
      return { type: 'T', dx: 0, dy: 0 }; });
  }

  // drawings of solver results

    if (d.kind === 'scan') { const [a, b, c, e] = bounds(d.verts, 1); return grid(a, b, c, e, (g) => d.spans.map(([y, sp]) => sp.map(([x0, x1]) => { let r = ''; for (let x = x0; x <= x1; x++) r += g.cell(x, y, 'pen', 0.45); return r; }).join('')).join('') + `<polygon points="${d.verts.map((p) => g.X(p[0]) + ',' + g.Y(p[1])).join(' ')}" class="markS"/>`, 460); }

    if (d.kind === 'sh') { const P = [[d.win[0], d.win[1]], [d.win[2], d.win[3]], ...d.poly]; const [a, b, c, e] = bounds(P, 1); return grid(a, b, c, e, (g) => `<rect x="${g.X(d.win[0])}" y="${g.Y(d.win[3])}" width="${(d.win[2] - d.win[0]) * g.s}" height="${(d.win[3] - d.win[1]) * g.s}" class="paperF" stroke="currentColor" stroke-width="2"/><polygon points="${d.poly.map((p) => g.X(p[0]) + ',' + g.Y(p[1])).join(' ')}" class="markS dash"/>` + (d.out.length ? `<polygon points="${d.out.map((p) => g.X(p[0]) + ',' + g.Y(p[1])).join(' ')}" class="softF" stroke="var(--pen)" stroke-width="3"/>` : ''), 460); }

    if (d.kind === 'down') { const H = d.img.length, W = d.img[0].length; const sh = (v) => `rgb(${v},${v},${v})`; let b = ''; const s = 26; d.img.forEach((r, i) => r.forEach((v, j) => { b += `<rect x="${j * s}" y="${i * s}" width="${s}" height="${s}" fill="${sh(v)}" stroke="var(--grid-strong)"/>`; })); d.out.forEach((r, i) => r.forEach((v, j) => { b += `<rect x="${W * s + 30 + j * 2 * s}" y="${i * 2 * s}" width="${2 * s}" height="${2 * s}" fill="${sh(Math.round(v))}" stroke="var(--grid-strong)"/>`; })); b += T(W * s + 15, H * s / 2 + 4, '→', 'lt'); return svg(W * s * 2 + 40, H * s, b, 'downsampling'); }

  VIEWS.mock = () => {
    if (!mock) return `<div class="sheet" style="display:grid;gap:12px"><h2>Mock Test 1</h2><p>Four tasks, 15 points, one from each block (displays/image, colour, rasterization, 2D graphics), with fresh numbers every time. Work on squared paper with your printed pack, just like the real test. Then reveal the model solutions and mark yourself.</p>
      <div class="row"><button class="btn primary" data-mock="45">Start · 45 min</button><button class="btn" data-mock="30">30 min</button><button class="btn ghost" data-mock="90">90 min (real length)</button></div>
      ${state.mocks.length ? `<div><div class="eyebrow">History</div><ul class="small">${state.mocks.slice(-8).reverse().map((m) => `<li>${new Date(m.at).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}: ${esc(m.score)} · ${esc(m.tasks)}</li>`).join('')}</ul></div>` : ''}</div>`;
    const left = Math.max(0, mock.minutes * 60 - Math.floor((Date.now() - mock.start) / 1000));
    return `<div class="sheet row" style="justify-content:space-between"><div><div class="eyebrow">time left</div><div class="timer${left < 300 ? ' low' : ''}" id="timer">${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}</div></div><div class="row"><button class="btn primary" id="reveal">${mock.shown ? 'Hide solutions' : 'Reveal solutions'}</button><button class="btn ghost" id="endmock">New mock</button></div></div>
    <div class="sheet" style="display:grid;gap:16px"><h2>GRK · Test 1 (mock) · 15 points</h2>${mock.tasks.map((t, i) => `<div class="mocktask"><div class="row" style="justify-content:space-between"><b>Task #${i + 1} · ${t.pts} points</b><span class="pill t-${TOPIC[SOLVERS[t.id].t].colour}">${esc(SOLVERS[t.id].name)}</span></div><p>${esc(t.text)}</p><div class="ex">${esc(describeVals(t.id, t.vals))}</div>
      ${mock.shown ? `<div style="display:grid;gap:10px">${renderResult(SOLVERS[t.id].run(coerce(SOLVERS[t.id], t.vals)))}<div class="row small"><span>My mark:</span>${[0, 0.25, 0.5, 0.75, 1].map((f) => `<button class="btn${mock.marks[i] === f ? ' primary' : ''}" data-mark="${i}:${f}">${(f * t.pts).toFixed(f * t.pts % 1 ? 1 : 0)}</button>`).join('')}</div></div>` : ''}</div>`).join('')}
    ${mock.shown ? `<div class="row"><button class="btn primary" id="savemock">Save score</button><span class="small muted">Partial credit counts: formula + method earn points even with an arithmetic slip.</span></div>` : ''}</div>`;
  };

  /* ---------------- render + events ---------------- */
  function render() {
    $$('nav.tabs button').forEach((b) => b.setAttribute('aria-current', b.dataset.v === view ? 'page' : 'false'));
    $('#main').innerHTML = `<div class="view">${VIEWS[view]()}</div>`;
    if (view === 'mock' && mock) { clearInterval(timerInt); timerInt = setInterval(() => { const el = $('#timer'); if (!el || !mock) { clearInterval(timerInt); return; } const left = Math.max(0, mock.minutes * 60 - Math.floor((Date.now() - mock.start) / 1000)); el.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`; el.classList.toggle('low', left < 300); }, 1000); }
    const days = Math.ceil((TEST - new Date()) / DAY); $('#cd').innerHTML = `Test 1 · <b>${days > 0 ? days + ' days' : 'today'}</b>`;
  }
  function go(v) { view = v; try { localStorage.setItem('grk-t1-view', v); } catch (e) { /* ignore */ } if (location.hash !== '#' + v) history.replaceState(null, '', '#' + v); render(); window.scrollTo(0, 0); }

  document.addEventListener('click', (e) => {
    const ot = e.target.closest('[data-opentask]'); if (ot) { e.preventDefault(); const id = ot.dataset.opentask; taskFilter = 'all'; go('tasks'); const el = document.getElementById('task-' + id); if (el) { el.open = true; el.scrollIntoView({ block: 'start' }); } return; }
    const b = e.target.closest('button, [data-go]'); if (!b) return;
    const d = b.dataset;
    if (d.v) return go(d.v);
    if (d.go) return go(d.go);
    if (d.cards) { cardFilter = { t: d.cards, mode: 'all' }; queue = []; return go('cards'); }
    if (d.tasks) { taskFilter = d.tasks; return go('tasks'); }
    if (d.ft) { cardFilter.t = d.ft; queue = []; return render(); }
    if (d.fm) { cardFilter.mode = d.fm; queue = []; return render(); }
    if (d.tf) { taskFilter = d.tf; return render(); }
    if (b.id === 'flip') { flipped = true; return render(); }
    if (d.g) { const c = queue.shift(); grade(c.id, d.g); if (d.g === 'again') queue.splice(Math.min(queue.length, 4), 0, c); flipped = false; return render(); }
    if (d.solve) { solverId = d.solve; hideSolution = false; return go('solve'); }
    if (d.solveRnd) { solverId = d.solveRnd; solverVals[solverId] = SOLVERS[solverId].rnd(); hideSolution = true; return go('solve'); }
    if (b.id === 'rnd') { solverVals[solverId] = SOLVERS[solverId].rnd(); hideSolution = true; return render(); }
    if (b.id === 'hide') { hideSolution = !hideSolution; return render(); }
    if (d.mock) { newMock(Number(d.mock)); return go('mock'); }
    if (b.id === 'reveal') { mock.shown = !mock.shown; return render(); }
    if (b.id === 'endmock') { mock = null; clearInterval(timerInt); return render(); }
    if (d.mark) { const [i, f] = d.mark.split(':').map(Number); mock.marks[i] = f; return render(); }
    if (b.id === 'savemock') { const sc = mock.tasks.reduce((a, t, i) => a + (mock.marks[i] || 0) * t.pts, 0); state.mocks.push({ at: Date.now(), score: `${Math.round(sc * 10) / 10}/15`, tasks: mock.tasks.map((t) => SOLVERS[t.id].name).join(', ') }); persist(); mock = null; return render(); }
  });
  document.addEventListener('input', (e) => {
    const el = e.target;
    if (el.id === 'pick') return;
    if (el.dataset && el.dataset.k && view === 'solve') {
      const s = SOLVERS[solverId]; solverVals[solverId] = solverVals[solverId] || Object.fromEntries(s.f.map((f) => [f[0], f[2]]));
      solverVals[solverId][el.dataset.k] = el.value;
      try { $('#out').innerHTML = hideSolution ? '<p class="muted">Solution hidden.</p>' : renderResult(s.run(coerce(s, solverVals[solverId]))); } catch (err) { $('#out').innerHTML = `<p class="trap">Check the inputs: ${esc(err.message)}</p>`; }
    }
  });
  document.addEventListener('change', (e) => { if (e.target.dataset && e.target.dataset.sprint) { state.sprint = state.sprint || {}; if (e.target.checked) state.sprint[e.target.dataset.sprint] = Date.now(); else delete state.sprint[e.target.dataset.sprint]; persist(); render(); return; } if (e.target.id === 'pick') { solverId = e.target.value; hideSolution = false; render(); } });
  document.addEventListener('keydown', (e) => {
    if (view !== 'cards' || /input|textarea|select/i.test(e.target.tagName)) return;
    if (e.key === ' ' && !flipped) { e.preventDefault(); flipped = true; render(); }
    else if (flipped && ['1', '2', '3'].includes(e.key)) { const c = queue.shift(); const g = { 1: 'again', 2: 'good', 3: 'easy' }[e.key]; grade(c.id, g); if (g === 'again') queue.splice(Math.min(queue.length, 4), 0, c); flipped = false; render(); }
  });
  const fromHash = () => { const h = location.hash.slice(1); return VIEWS[h] ? h : null; };
  window.addEventListener('hashchange', () => { const h = fromHash(); if (h && h !== view) { view = h; render(); } });
  let start = fromHash(); if (!start) { try { start = localStorage.getItem('grk-t1-view'); } catch (e) { /* ignore */ } }
  view = VIEWS[start] ? start : 'today';
  render();
  window.__GRK_TEST = { SOLVERS, CARDS, plot, renderResult, F };
})();
</script>
</body></html>
