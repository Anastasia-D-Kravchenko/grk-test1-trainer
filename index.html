<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Study trainer for PJATK GRK Test 1: cards, task recipes, step-by-step solver, mock tests."></head><body><title>GRK Test 1 Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: squared exam paper. One column on phones, a two-pane desk on wide screens. Bottom tab bar on phones. */
:root {
  --paper: #f6f7fa; --sheet: #ffffff; --grid: #e3e8f2; --grid-strong: #c4cde0;
  --ink: #18202f; --muted: #5a6478; --line: #d4dbe8;
  --r: #d23a4f; --g: #148a57; --b: #2b62d9; --accent: #2b62d9; --accent-ink: #ffffff;
  --pen: #2b62d9; --mark: #d23a4f; --ok: #148a57; --warn: #b85c00; --soft: rgba(43, 98, 217, .12);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Helvetica Neue", Arial, system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r-sm: 6px; --r-md: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0e121a; --sheet: #151b26; --grid: #1d2533; --grid-strong: #2c374b;
  --ink: #e5e9f2; --muted: #9aa4b8; --line: #2a3446;
  --r: #ff6b7d; --g: #3ccf8e; --b: #6e9bff; --accent: #6e9bff; --accent-ink: #0b0f16;
  --pen: #6e9bff; --mark: #ff6b7d; --ok: #3ccf8e; --warn: #ffae57; --soft: rgba(110, 155, 255, .16); color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0e121a; --sheet: #151b26; --grid: #1d2533; --grid-strong: #2c374b;
  --ink: #e5e9f2; --muted: #9aa4b8; --line: #2a3446;
  --r: #ff6b7d; --g: #3ccf8e; --b: #6e9bff; --accent: #6e9bff; --accent-ink: #0b0f16;
  --pen: #6e9bff; --mark: #ff6b7d; --ok: #3ccf8e; --warn: #ffae57; --soft: rgba(110, 155, 255, .16); color-scheme: dark }

* { box-sizing: border-box }
html, body { height: 100% }
body { background: var(--paper); color: var(--ink); font: 16px/1.5 var(--font-body);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px; background-attachment: fixed }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet) }
button, input, select, textarea { font: inherit; color: inherit }
a { color: var(--accent) }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15 }
h2 { font-size: 1.35rem; font-weight: 700 }
h3 { font-size: 1.05rem; font-weight: 700 }
code, .mono { font-family: var(--font-mono); font-size: .88em }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--sheet); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.top-in { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap }
.brand { display: flex; align-items: baseline; gap: 8px; margin-right: auto }
.brand h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: -.01em }
.brand .px { display: inline-flex; gap: 2px; transform: translateY(-1px) }
.brand .px i { width: 7px; height: 7px; display: block }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); font-size: .82rem; color: var(--muted); background: var(--sheet); white-space: nowrap }
.chip b { color: var(--ink); font-variant-numeric: tabular-nums }
.sync { font-size: .78rem; color: var(--muted) }

nav.tabs { display: flex; gap: 4px }
nav.tabs button { border: 0; background: none; padding: 6px 10px; border-radius: var(--r-sm); color: var(--muted); cursor: pointer; font-weight: 700; font-size: .9rem }
nav.tabs button[aria-current="page"] { background: var(--soft); color: var(--accent) }
@media (max-width: 760px) {
  nav.tabs { position: fixed; z-index: 9; left: 0; right: 0; bottom: 0; background: var(--sheet); border-top: 1px solid var(--line); justify-content: space-around;
    padding-top: 4px; padding-bottom: calc(4px + env(safe-area-inset-bottom, 0px)); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)) }
  nav.tabs button { flex: 1; font-size: .74rem; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; gap: 2px }
  nav.tabs svg { width: 20px; height: 20px }
  main { padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)) !important }
}
@media (min-width: 761px) { nav.tabs svg { display: none } }

main { max-width: 1100px; margin: 0 auto; padding-block: 18px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.view { display: grid; gap: 16px }
.sheet { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px; min-width: 0 }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.grid2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)) }
.muted { color: var(--muted) }
.small { font-size: .86rem }
.eyebrow { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700 }
.btn { border: 1px solid var(--line); background: var(--sheet); padding: 8px 14px; border-radius: var(--r-sm); cursor: pointer; font-weight: 700 }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn.ghost { background: transparent }
.btn.mini { padding: 4px 9px; font-size: .8rem }
.btn:disabled { opacity: .5; cursor: default }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: .74rem; font-weight: 700; border: 1px solid currentColor }
.t-r { color: var(--r) } .t-g { color: var(--g) } .t-b { color: var(--b) }
.tbar { width: 4px; border-radius: 2px; align-self: stretch }
.bg-r { background: var(--r) } .bg-g { background: var(--g) } .bg-b { background: var(--b) }

/* Today */
.countdown { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center }
.big { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.6rem, 9vw, 4rem); line-height: 1; font-variant-numeric: tabular-nums }
.plan { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none }
.plan li { display: grid; grid-template-columns: 74px 1fr; gap: 10px; padding: 8px 10px; border-radius: var(--r-sm); border: 1px solid transparent }
.plan li.today { border-color: var(--accent); background: var(--soft) }
.plan li.past { opacity: .55 }
.plan .d { font-family: var(--font-mono); font-size: .8rem; color: var(--muted); padding-top: 2px }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px }
.stat { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px }
.stat b { display: block; font-family: var(--font-display); font-size: 1.6rem; font-variant-numeric: tabular-nums }
.meter { height: 8px; border-radius: 4px; background: var(--grid); overflow: hidden; display: flex }
.meter i { display: block; height: 100% }

/* Sprint */
.blocks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px }
.blk { display: grid; grid-template-columns: 28px 92px 1fr; gap: 8px; padding: 8px; border: 1px solid var(--line); border-radius: var(--r-sm); align-items: start }
.blk .bb { min-width: 0 } .blk .d { font-family: var(--font-mono); font-size: .8rem; color: var(--muted) }
.blk.now { border-color: var(--g); background: color-mix(in srgb, var(--g) 10%, transparent) }
.blk.done { opacity: .6 } .blk.done b { text-decoration: line-through }
.tick input { width: 20px; height: 20px; accent-color: var(--g); margin-top: 2px }
@media (max-width: 560px) { .blk { grid-template-columns: 28px 1fr } .blk .bt { grid-column: 2 } .blk .bb { grid-column: 2 } }

/* Cards */
.filters { display: flex; gap: 6px; flex-wrap: wrap }
@media (max-width: 760px) { .filters { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin } .filters button { white-space: nowrap; flex: none } }
.filters button { border: 1px solid var(--line); background: var(--sheet); border-radius: 999px; padding: 4px 10px; font-size: .82rem; cursor: pointer }
.filters button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--soft); font-weight: 700 }
.card { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r-md); min-height: 300px; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden }
.card .head { display: flex; justify-content: space-between; gap: 8px; padding: 10px 14px; border-bottom: 1px dashed var(--line); font-size: .8rem; color: var(--muted) }
.card .body { padding: 18px 16px; display: grid; gap: 14px; align-content: start; min-width: 0 }
.card .q { font-size: 1.12rem; font-weight: 700 }
.card .a { font-size: 1.02rem; border-top: 2px solid var(--accent); padding-top: 12px; white-space: pre-line }
.card .extra { font-size: .9rem; color: var(--muted); display: grid; gap: 6px }
.card .foot { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px; border-top: 1px solid var(--line) }
.card .foot .btn { padding: 12px 6px }
.again { color: var(--r) } .good { color: var(--g) }
.fig { display: flex; justify-content: center; overflow-x: auto }
.fig svg { max-width: 100%; height: auto }

/* Tasks */
details.task { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden }
details.task > summary { list-style: none; cursor: pointer; padding: 12px 14px; display: grid; grid-template-columns: 4px 1fr auto; gap: 12px; align-items: center }
details.task > summary::-webkit-details-marker { display: none }
details.task[open] > summary { border-bottom: 1px solid var(--line) }
.task .inner { padding: 14px; display: grid; gap: 12px; min-width: 0 }
.task ol { margin: 0; padding-left: 22px; display: grid; gap: 4px }
.task blockquote { margin: 0; padding: 8px 12px; border-left: 3px solid var(--line); color: var(--muted); font-style: italic }
.ex { font-family: var(--font-mono); font-size: .86rem; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px; white-space: pre-wrap; overflow-x: auto }
.trap { color: var(--warn) }

/* Solver */
.solver-pick { width: 100%; padding: 10px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--sheet) }
.inputs { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)) }
.inputs label { display: grid; gap: 4px; font-size: .8rem; color: var(--muted); font-weight: 700 }
.inputs label.wide { grid-column: 1 / -1 }
.inputs input, .inputs select, .inputs textarea { padding: 8px 10px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--paper); font-family: var(--font-mono); font-size: .92rem; width: 100%; min-width: 0 }
.inputs textarea { min-height: 120px; line-height: 1.2 }
.answer { font-family: var(--font-mono); font-weight: 600; background: var(--soft); border-radius: var(--r-sm); padding: 10px 12px; overflow-wrap: anywhere }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: .94rem }
.steps li { white-space: pre-wrap; overflow-wrap: anywhere }
.tablebox { overflow-x: auto }
table { border-collapse: collapse; font-size: .86rem; font-variant-numeric: tabular-nums }
th, td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; white-space: nowrap; font-family: var(--font-mono) }
th { background: var(--paper); font-family: var(--font-body) }
.log { font-family: var(--font-mono); font-size: .84rem; white-space: pre-wrap; background: var(--paper); border-radius: var(--r-sm); padding: 10px; overflow-x: auto; margin: 0 }
.plot { overflow-x: auto; display: flex; justify-content: center }
.plot svg { max-width: 100%; height: auto }

/* Mock */
.mocktask { border-top: 1px dashed var(--line); padding-top: 14px; display: grid; gap: 8px }
.timer { font-family: var(--font-display); font-weight: 800; font-size: 2rem; font-variant-numeric: tabular-nums }
.timer.low { color: var(--r) }

/* Topics */
.topic h3 { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap }
.formula { font-family: var(--font-mono); font-size: .86rem; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 4px 8px; display: inline-block; margin: 2px 0 }
.hook { border-left: 3px solid var(--g); padding-left: 10px }
.vids { display: grid; gap: 6px; padding: 0; margin: 0; list-style: none }
.vids a { font-weight: 700 }

/* svg figure tokens */
.svgc { color: var(--ink) }
.svgc .gl { stroke: var(--grid-strong); stroke-width: 1 }
.svgc .ax { stroke: var(--muted); stroke-width: 1.5 }
.svgc .lb { fill: var(--muted); font: 600 11px var(--font-mono) }
.svgc .lt { fill: var(--ink); font: 700 12px var(--font-body) }
.svgc .ink { stroke: var(--ink); fill: none; stroke-width: 2 }
.svgc .pen { fill: var(--pen) } .svgc .penS { stroke: var(--pen); fill: none; stroke-width: 2.5 }
.svgc .mark { fill: var(--mark) } .svgc .markS { stroke: var(--mark); fill: none; stroke-width: 2.5 }
.svgc .okF { fill: var(--ok) } .svgc .okS { stroke: var(--ok); fill: none; stroke-width: 2.5 }
.svgc .softF { fill: var(--soft) } .svgc .paperF { fill: var(--sheet) }
.svgc .dash { stroke-dasharray: 5 4 }
@media (prefers-reduced-motion: no-preference) { .card .a { animation: rise .18s ease-out } @keyframes rise { from { opacity: .3; transform: translateY(4px) } to { opacity: 1; transform: none } } }
</style>

<script>/* GRK Test 1 solver engine — pure functions, no DOM.
   Every solver returns { answer: string, steps: [string], table?: {head, rows}, draw?: {...} }.
   Conventions follow Szymański's lectures 1–6 (see cheat sheet). */
(function (root) {
  'use strict';
  const E = {};

  /* ---------- formatting helpers ---------- */
  const fmt = (v, d = 4) => {
    if (typeof v !== 'number' || !isFinite(v)) return String(v);
    if (Math.abs(v) < 1e-12) return '0';
    const r = Math.round(v * 10 ** d) / 10 ** d;
    return String(r).replace(/^-0$/, '0');
  };
  const sci = (v) => {
    if (!isFinite(v) || v === 0) return fmt(v);
    const e = Math.floor(Math.log10(Math.abs(v)));
    if (e >= -3 && e < 7) return fmt(v, 4);
    return fmt(v / 10 ** e, 3) + '·10^' + e;
  };
  const big = (v) => Math.round(v).toLocaleString('en-US');
  const pt = (p, d = 4) => '(' + p.map((v) => fmt(v, d)).join(', ') + ')';
  const vec = (p, d = 4) => '[' + p.map((v) => fmt(v, d)).join(', ') + ']';
  const roundHalfUp = (v) => Math.floor(v + 0.5 + 1e-9);
  E.fmt = fmt; E.sci = sci; E.pt = pt; E.vec = vec; E.roundHalfUp = roundHalfUp;

  /* ================= Lecture 1: displays, pipeline, vectors ================= */
  E.dataRate = ({ w, h, bits = 24, hz }) => {
    const px = w * h, bytes = px * bits / 8 * hz;
    return {
      answer: `${big(bytes)} B/s ≈ ${sci(bytes)} B/s ≈ ${fmt(bytes / 1e9, 3)} GB/s (${fmt(bytes / 2 ** 30, 3)} GiB/s)`,
      steps: [
        `pixels per frame = ${w} × ${h} = ${big(px)}`,
        `bytes per pixel = ${bits} bits ÷ 8 = ${fmt(bits / 8)} B`,
        `data rate = pixels × bytes/px × refresh = ${big(px)} × ${fmt(bits / 8)} × ${hz} Hz = ${big(bytes)} B/s`,
        `in bits/s: × 8 = ${sci(bytes * 8)} b/s`,
        `Lecture slide 26 takes 4K = 4096×2160 and rounds up to 10⁷ pixel-clock ticks (blanking included): 10⁷ × 3 B × 60 = 1.8·10⁹ B/s ≈ "1,7 GB/s" (binary GiB). Write the exact pixel count and mention that rounding.`,
      ],
    };
  };

  E.pixelTime = ({ w, h, hz }) => {
    const n = w * h * hz, t = 1 / n;
    return {
      answer: `t = 1/(${w}·${h}·${hz}) = ${sci(t)} s ≈ ${fmt(t * 1e9, 3)} ns`,
      steps: [
        `pixels per second = ${w} × ${h} × ${hz} = ${big(n)}`,
        `time per pixel = 1 ÷ ${big(n)} s = ${sci(t)} s = ${fmt(t * 1e9, 4)} ns`,
        `(per frame: 1/${hz} s = ${fmt(1000 / hz, 4)} ms; per line: ${fmt(1e6 / (hz * h), 4)} µs)`,
      ],
    };
  };

  // numbers needed per primitive (2D unless noted)
  E.VECTOR_NUMS = { point: 2, line: 4, circle: 3, triangle: 6, rectangle: 8, square: 8, ellipse: 4, 'cube (3D)': 24, 'point (3D)': 3, 'triangle (3D)': 9 };
  E.vectorMemory = ({ items, bytes = 4 }) => {
    let total = 0; const rows = [];
    items.forEach(({ kind, count, nums }) => {
      const n = nums != null ? nums : E.VECTOR_NUMS[kind];
      const b = n * bytes * count; total += b;
      rows.push([kind, count, n, `${n}·${bytes} = ${n * bytes} B`, `${big(b)} B`]);
    });
    return {
      answer: `${big(total)} B`,
      table: { head: ['shape', 'count', 'numbers each', 'bytes each', 'subtotal'], rows },
      steps: [
        'Vector image = list of shapes, each stored as its defining numbers (no pixels).',
        'circle = centre x, y + radius r → 3 numbers; triangle = 3 vertices × (x, y) → 6; rectangle as 4 corners → 8 (or 4 numbers if stored as x, y, w, h: say which).',
        `total = ${rows.map((r) => r[4]).join(' + ')} = ${big(total)} B`,
      ],
    };
  };

  E.vecOps = ({ a, b }) => {
    const sum = a.map((v, i) => v + b[i]), diff = b.map((v, i) => v - a[i]);
    const dot = a.reduce((s, v, i) => s + v * b[i], 0);
    const A = [...a, 0, 0].slice(0, 3), B = [...b, 0, 0].slice(0, 3);
    const cross = [A[1] * B[2] - A[2] * B[1], A[2] * B[0] - A[0] * B[2], A[0] * B[1] - A[1] * B[0]];
    const len = (v) => Math.hypot(...v);
    const cos = dot / (len(a) * len(b));
    return {
      answer: `a + b = ${vec(sum)} · a × b = ${vec(cross)} · a·b = ${fmt(dot)}`,
      steps: [
        `a + b = ${vec(a)} + ${vec(b)} = ${vec(sum)} (draw b starting at the tip of a)`,
        `b − a = ${vec(diff)}`,
        `a · b = ${a.map((v, i) => `${fmt(v)}·${fmt(b[i])}`).join(' + ')} = ${fmt(dot)} → angle = ${fmt(Math.acos(Math.max(-1, Math.min(1, cos))) * 180 / Math.PI, 2)}°`,
        `a × b = [a_y b_z − a_z b_y, a_z b_x − a_x b_z, a_x b_y − a_y b_x] = [${fmt(A[1])}·${fmt(B[2])} − ${fmt(A[2])}·${fmt(B[1])}, ${fmt(A[2])}·${fmt(B[0])} − ${fmt(A[0])}·${fmt(B[2])}, ${fmt(A[0])}·${fmt(B[1])} − ${fmt(A[1])}·${fmt(B[0])}] = ${vec(cross)}`,
        `|a| = ${fmt(len(a))}, |b| = ${fmt(len(b))}, |a × b| = ${fmt(len(cross))} (= area of the parallelogram)`,
        'Right-hand rule: fingers along a, curl toward b, thumb = a × b. x × y = z, y × z = x, z × x = y; b × a = −(a × b).',
      ],
    };
  };

  E.matVec = ({ m, v }) => {
    const r = m.map((row) => row.reduce((s, x, j) => s + x * v[j], 0));
    return {
      answer: `${vec(r)}`,
      steps: m.map((row, i) => `row ${i + 1}: ${row.map((x, j) => `${fmt(x)}·${fmt(v[j])}`).join(' + ')} = ${fmt(r[i])}`)
        .concat([`result ${vec(r)}. If the last coordinate is a homogeneous w ≠ 1, divide by it.`]),
    };
  };

  /* ================= Lecture 2: image representation ================= */
  E.bitmapMemory = ({ w, h, bits }) => {
    const b = w * h * bits, B = b / 8;
    return {
      answer: `${big(B)} B = ${fmt(B / 1e6, 4)} MB (${fmt(B / 2 ** 20, 4)} MiB)`,
      steps: [
        `bits = ${w} × ${h} × ${bits} = ${big(b)} bits`,
        `bytes = ${big(b)} ÷ 8 = ${big(B)} B`,
        `MB (10⁶) = ${fmt(B / 1e6, 4)} MB; MiB (2²⁰ = 1,048,576) = ${fmt(B / 2 ** 20, 4)} MiB; KB = ${fmt(B / 1e3, 2)} kB / ${fmt(B / 1024, 2)} KiB`,
        'Write which megabyte you mean. Both are accepted if you say it.',
      ],
    };
  };

  E.ppi = ({ diag, w, h, aw = 16, ah = 9 }) => {
    const k = Math.hypot(aw, ah), W = diag * aw / k, H = diag * ah / k;
    return {
      answer: `${fmt(w / W, 2)} ppi (width ${fmt(W, 3)}″, height ${fmt(H, 3)}″)`,
      steps: [
        `aspect ${aw}:${ah} → diagonal units = √(${aw}² + ${ah}²) = √${aw * aw + ah * ah} = ${fmt(k, 4)}`,
        `width = ${diag} · ${aw}/${fmt(k, 4)} = ${fmt(W, 4)}″, height = ${diag} · ${ah}/${fmt(k, 4)} = ${fmt(H, 4)}″`,
        `linear resolution = ${w} px ÷ ${fmt(W, 4)}″ = ${fmt(w / W, 3)} ppi (check: ${h} ÷ ${fmt(H, 4)} = ${fmt(h / H, 3)} ppi)`,
        `pixel size = 25.4 mm ÷ ${fmt(w / W, 2)} = ${fmt(25.4 * W / w, 3)} mm`,
      ],
    };
  };

  E.eyeLimit = ({ W, D }) => {
    const x = D * Math.tan(Math.PI / 180 / 60), n = W / x;
    return {
      answer: `≈ ${Math.round(n)} pixels across (smallest visible detail ${fmt(x * 10, 4)} mm)`,
      steps: [
        'The eye separates details down to about 1 arc-minute = 1/60°.',
        `smallest detail at distance D: x = D · tan(1/60°) = ${D} · ${fmt(Math.tan(Math.PI / 180 / 60), 7)} = ${fmt(x, 5)} (same unit as D)`,
        `max pixels across the width: n = W / x = ${W} / ${fmt(x, 5)} = ${fmt(n, 1)}`,
        `Slide 20 rounds tan 1′ ≈ 0.00029: x = ${D}·0.00029 = ${fmt(D * 0.00029, 5)} → n = ${fmt(W / (D * 0.00029), 1)} (the lecturer's number for 30 cm @ 50 cm is ≈ 2069). Show the formula; either value is fine.`,
        'More pixels than that are wasted: the eye cannot resolve them at this distance.',
      ],
    };
  };

  E.bilinear = ({ A, B, C, D, a, b }) => {
    const P1 = a * B + (1 - a) * A, P2 = a * D + (1 - a) * C, N = b * P2 + (1 - b) * P1;
    return {
      answer: `N = ${fmt(N, 4)} (≈ ${Math.round(N)})`,
      steps: [
        'Layout: A —— B on the first row, C —— D on the second; α = horizontal fraction from A toward B, β = vertical fraction from row AB toward row CD.',
        `P1 = α·B + (1−α)·A = ${fmt(a)}·${B} + ${fmt(1 - a)}·${A} = ${fmt(P1)}`,
        `P2 = α·D + (1−α)·C = ${fmt(a)}·${D} + ${fmt(1 - a)}·${C} = ${fmt(P2)}`,
        `N = β·P2 + (1−β)·P1 = ${fmt(b)}·${fmt(P2)} + ${fmt(1 - b)}·${fmt(P1)} = ${fmt(N)}`,
        'Check: N must lie between the smallest and largest of A, B, C, D.',
      ],
    };
  };

  E.downsample = ({ img, k = 2 }) => {
    const H = img.length, W = img[0].length, out = [];
    for (let i = 0; i + k <= H; i += k) {
      const row = [];
      for (let j = 0; j + k <= W; j += k) {
        let s = 0; for (let di = 0; di < k; di++) for (let dj = 0; dj < k; dj++) s += img[i + di][j + dj];
        row.push(s / (k * k));
      }
      out.push(row);
    }
    return {
      answer: out.map((r) => r.map((v) => fmt(v, 2)).join(' ')).join(' / '),
      out,
      steps: [
        `Reduce ${k}:1 → each new pixel = average of a ${k}×${k} block of old pixels (box filter).`,
        `Old ${W}×${H} → new ${Math.floor(W / k)}×${Math.floor(H / k)}.`,
        'Pseudo-code:\nColor[][] small = new Color[50][50];\nfor (y = 0; y < 50; y++)\n  for (x = 0; x < 50; x++)\n    small[y][x] = (image[2y][2x] + image[2y][2x+1]\n                 + image[2y+1][2x] + image[2y+1][2x+1]) / 4;  // per R, G, B',
        'Quality check: if detail is finer than the new pixel (e.g. a 1-px checkerboard), every block averages to the same grey → the pattern is lost (undersampling / aliasing).',
      ],
    };
  };

  /* ================= Lecture 3: colour ================= */
  E.colours = ({ bits }) => {
    const per = 2 ** bits, n = per ** 3;
    return {
      answer: `(2^${bits})³ = ${per}³ = ${big(n)} colours`,
      steps: [
        `levels per channel = 2^${bits} = ${per} (values 0…${per - 1})`,
        `colours = ${per} × ${per} × ${per} = ${big(n)} (bits per pixel = 3·${bits} = ${3 * bits}, so also 2^${3 * bits})`,
        'Grey levels only (R = G = B): just ' + per + '.',
      ],
    };
  };

  E.quantize = ({ values, to, from = 8 }) => {
    const step = 2 ** (from - to), maxN = 2 ** to - 1, maxO = 2 ** from - 1;
    const rows = values.map((v) => {
      const q = Math.floor(v / step);
      return [v, `${v} / ${step} = ${fmt(v / step, 3)}`, q, roundHalfUp(v * maxN / maxO), roundHalfUp(q * maxO / maxN)];
    });
    return {
      answer: values.map((v, i) => `${v} → ${rows[i][2]}`).join(', '),
      table: { head: [`${from}-bit value`, `÷ 2^${from - to}`, `${to}-bit (floor, main)`, `${to}-bit (round v·${maxN}/${maxO})`, `floor shown back as ${from}-bit`], rows },
      steps: [
        `${from} → ${to} bits: drop the ${from - to} lowest bits = integer-divide by 2^${from - to} = ${step} (floor). Range becomes 0…${maxN}.`,
        `To display again on ${from} bits: q · ${maxO}/${maxN}.`,
        `The slides give no rule, so state yours. Alternative: round(v·${maxN}/${maxO}) (scales 255 → ${maxN} exactly); it can differ by 1 near the top (240 → 14 instead of 15 at 4 bits).`,
        'Look for values that become equal: two objects that differed may merge (lost contrast / banding).',
      ],
    };
  };

  E.cmy = ({ rgb }) => {
    const c = rgb.map((v) => 255 - v), k = Math.min(...c);
    const cmyk = k === 255 ? [0, 0, 0, 255] : [...c.map((v) => v - k), k];
    return {
      answer: `CMY = ${vec(c)}`,
      steps: [
        `C = 255 − R = 255 − ${rgb[0]} = ${c[0]}; M = 255 − G = ${c[1]}; Y = 255 − B = ${c[2]}`,
        'CMY is subtractive (inks): [0,0,0] = white paper, [255,255,255] = black.',
        `CMYK (extra): K = min(C,M,Y) = ${k} → ${vec(cmyk)} (C−K, M−K, Y−K, K).`,
      ],
    };
  };

  E.grey = ({ rgb }) => {
    const [R, G, B] = rgb, w = 0.299 * R + 0.587 * G + 0.114 * B, avg = (R + G + B) / 3;
    return {
      answer: `weighted ${fmt(w, 3)} ≈ ${roundHalfUp(w)} (plain average ${fmt(avg, 2)})`,
      steps: [
        `Y = 0.299·R + 0.587·G + 0.114·B = 0.299·${R} + 0.587·${G} + 0.114·${B} = ${fmt(0.299 * R, 3)} + ${fmt(0.587 * G, 3)} + ${fmt(0.114 * B, 3)} = ${fmt(w, 3)} → ${roundHalfUp(w)}`,
        'Green weighs most because the eye is most sensitive to green, blue least.',
        `Simple version (lecture also shows it): (R + G + B)/3 = ${fmt(avg, 3)}. Note the brackets: (R+G+B)/3, not R+G+B/3.`,
      ],
    };
  };

  E.mix = ({ c1, c2, w = 0.5 }) => {
    const m = c1.map((v, i) => w * v + (1 - w) * c2[i]);
    const add = c1.map((v, i) => Math.min(255, v + c2[i]));
    return {
      answer: `${vec(m.map(roundHalfUp))} (exact ${vec(m, 2)})`,
      steps: [
        `mix in proportion ${fmt(w)} : ${fmt(1 - w)} → each channel = ${fmt(w)}·c1 + ${fmt(1 - w)}·c2`,
        `R = ${fmt(w)}·${c1[0]} + ${fmt(1 - w)}·${c2[0]} = ${fmt(m[0], 2)}; G = ${fmt(m[1], 2)}; B = ${fmt(m[2], 2)}`,
        `On the chromaticity diagram the mix lies on the segment between the two colours (closer to the bigger share).`,
        `(Adding light at full power instead: clamp(c1 + c2) = ${vec(add)}.)`,
      ],
    };
  };

  E.rgb2hsv = ({ rgb, max = 255 }) => {
    const [r, g, b] = rgb.map((v) => v / max), M = Math.max(r, g, b), m = Math.min(r, g, b), d = M - m;
    let H = 0;
    if (d > 0) {
      if (M === r) H = 60 * (((g - b) / d) % 6);
      else if (M === g) H = 60 * ((b - r) / d + 2);
      else H = 60 * ((r - g) / d + 4);
    }
    if (H < 0) H += 360;
    const S = M === 0 ? 0 : d / M, V = M;
    let where;
    if (d === 0) where = V === 0 ? 'the tip of the cone (black)' : (V === 1 ? 'centre of the top disc (white)' : 'on the central grey axis');
    else if (S > 0.999 && V > 0.999) where = 'the rim of the top disc (pure, fully saturated, bright)';
    else if (S > 0.999) where = `the cone's side surface at height V = ${fmt(V, 3)}`;
    else if (V > 0.999) where = `inside the top disc, ${fmt(S * 100, 0)} % of the way from the centre to the rim`;
    else where = `inside the cone: height V = ${fmt(V, 3)}, ${fmt(S * 100, 0)} % out from the axis`;
    return {
      answer: `H = ${fmt(H, 1)}°, S = ${fmt(S, 3)}, V = ${fmt(V, 3)} → ${where}`,
      hsv: [H, S, V],
      steps: [
        `normalise: r, g, b = ${rgb.map((v) => fmt(v / max, 3)).join(', ')} (÷ ${max})`,
        `V = max = ${fmt(M, 3)}; min = ${fmt(m, 3)}; Δ = ${fmt(d, 3)}`,
        `S = Δ / max = ${M === 0 ? '0 (black)' : fmt(S, 3)}`,
        `H: max is ${d === 0 ? 'undefined (grey)' : (M === r ? 'R → 60·((g−b)/Δ mod 6)' : M === g ? 'G → 60·((b−r)/Δ + 2)' : 'B → 60·((r−g)/Δ + 4)')} = ${fmt(H, 1)}°`,
        'Hue wheel: 0° red, 60° yellow, 120° green, 180° cyan, 240° blue, 300° magenta.',
        `Place in the HSV cone: ${where}.`,
      ],
    };
  };

  E.hsv2rgb = ({ h, s, v }) => {
    const c = v * s, x = c * (1 - Math.abs(((h / 60) % 2) - 1)), m = v - c;
    const k = Math.floor(((h % 360) + 360) % 360 / 60);
    const t = [[c, x, 0], [x, c, 0], [0, c, x], [0, x, c], [x, 0, c], [c, 0, x]][k];
    const rgb = t.map((u) => roundHalfUp((u + m) * 255));
    return { answer: vec(rgb), steps: [`C = V·S = ${fmt(c, 3)}, X = ${fmt(x, 3)}, m = V − C = ${fmt(m, 3)}`, `sector ${k} (${k * 60}°…${k * 60 + 60}°) → (r,g,b) = ${vec(t.map((u) => u + m), 3)} → ×255 = ${vec(rgb)}`] };
  };

  /* ================= Lectures 4–5: rasterization ================= */
  E.dda = ({ x0, y0, x1, y1 }) => {
    const dx = x1 - x0, dy = y1 - y0, rows = [], pts = [];
    const steep = Math.abs(dy) > Math.abs(dx);
    const steps = [];
    if (dx === 0 && dy === 0) return { answer: `(${x0},${y0})`, steps: ['single point'], draw: { kind: 'line', pts: [[x0, y0]], a: [x0, y0], b: [x1, y1] } };
    if (!steep) {
      if (x1 < x0) return E.dda({ x0: x1, y0: y1, x1: x0, y1: y0 });
      const m = dy / dx; let y = y0;
      steps.push(`m = Δy/Δx = ${dy}/${dx} = ${fmt(m)} → |m| ≤ 1, step x by 1, y += m, plot round(y)`);
      for (let x = x0; x <= x1; x++) { const r = roundHalfUp(y); rows.push([x, fmt(y), r, `(${x},${r})`]); pts.push([x, r]); y += m; }
      return { answer: pts.map((p) => `(${p[0]},${p[1]})`).join(' '), steps: steps.concat(['One pixel per column; round 0.5 up.']), table: { head: ['x', 'y exact', 'round(y)', 'pixel'], rows }, draw: { kind: 'line', pts, a: [x0, y0], b: [x1, y1] } };
    }
    if (y1 < y0) return E.dda({ x0: x1, y0: y1, x1: x0, y1: y0 });
    const k = dx / dy; let x = x0;
    steps.push(`|m| = ${fmt(Math.abs(dy / dx || Infinity))} > 1 (steeper than 45°) → swap roles: step y by 1, x += 1/m = ${fmt(k)}, plot round(x)`);
    for (let y = y0; y <= y1; y++) { const r = roundHalfUp(x); rows.push([y, fmt(x), r, `(${r},${y})`]); pts.push([r, y]); x += k; }
    return { answer: pts.map((p) => `(${p[0]},${p[1]})`).join(' '), steps, table: { head: ['y', 'x exact', 'round(x)', 'pixel'], rows }, draw: { kind: 'line', pts, a: [x0, y0], b: [x1, y1] } };
  };

  E.bresenham = ({ x0, y0, x1, y1 }) => {
    const notes = [];
    let steep = Math.abs(y1 - y0) > Math.abs(x1 - x0);
    let ax0 = x0, ay0 = y0, ax1 = x1, ay1 = y1;
    if (steep) { [ax0, ay0] = [ay0, ax0]; [ax1, ay1] = [ay1, ax1]; notes.push('|m| > 1: swap x and y (step along y), swap back when plotting.'); }
    if (ax1 < ax0) { [ax0, ax1] = [ax1, ax0]; [ay0, ay1] = [ay1, ay0]; notes.push('Start from the endpoint with the smaller ' + (steep ? 'y' : 'x') + ' (lecture rule).'); }
    const dx = ax1 - ax0, dyS = ay1 - ay0, ys = dyS < 0 ? -1 : 1, dy = Math.abs(dyS);
    if (ys < 0) notes.push('Negative slope: same algorithm with |Δy|, but "up" means y − 1.');
    const a = 2 * dy, b = 2 * dy - 2 * dx; let p = 2 * dy - dx, x = ax0, y = ay0;
    const rows = [], pts = [];
    const plot = (u, v) => (steep ? [v, u] : [u, v]);
    pts.push(plot(x, y));
    while (x < ax1) {
      const up = p >= 0, np = up ? p + b : p + a, nx = x + 1, ny = up ? y + ys : y;
      rows.push([`(${plot(x, y).join(',')})`, p, up ? 'p ≥ 0 → step (diagonal)' : 'p < 0 → straight', `(${plot(nx, ny).join(',')})`, nx === ax1 ? '(end)' : `${p} ${up ? '+ b' : '+ a'} = ${np}`]);
      x = nx; y = ny; p = np; pts.push(plot(x, y));
    }
    return {
      answer: pts.map((q) => `(${q[0]},${q[1]})`).join(' '),
      steps: [
        `Δx = ${dx}, Δy = ${dy}${steep ? ' (axes swapped)' : ''}`,
        `a = 2Δy = ${a}, b = 2Δy − 2Δx = ${b}, p₀ = 2Δy − Δx = ${2 * dy - dx}`,
        'p < 0 → next pixel in the same row, p += a; p ≥ 0 → next pixel one row up, p += b.',
      ].concat(notes),
      table: { head: ['current', 'p', 'decision', 'next', 'new p'], rows },
      draw: { kind: 'line', pts, a: [x0, y0], b: [x1, y1] },
    };
  };

  E.circle = ({ r, xc = 0, yc = 0 }) => {
    let x = 0, y = r, p = 1.25 - r; const rows = [], oct = [[0, r]];
    while (x < y) {
      const cur = `(${x},${y})`, pp = p;
      if (p < 0) { x++; p = p + 2 * x + 1; rows.push([cur, fmt(pp), 'p < 0 → same row', `(${x},${y})`, `${fmt(pp)} + 2·${x} + 1 = ${fmt(p)}`]); }
      else { x++; y--; p = p + 2 * x + 1 - 2 * y; rows.push([cur, fmt(pp), 'p ≥ 0 → one row down', `(${x},${y})`, `${fmt(pp)} + 2·${x} + 1 − 2·${y} = ${fmt(p)}`]); }
      oct.push([x, y]);
    }
    if (oct.length > 1 && oct[oct.length - 1][0] > oct[oct.length - 1][1]) oct.pop();
    const all = new Map();
    oct.forEach(([a, b]) => [[a, b], [b, a]].forEach(([u, v]) => [[1, 1], [1, -1], [-1, 1], [-1, -1]].forEach(([s, t]) => all.set(`${xc + s * u},${yc + t * v}`, [xc + s * u, yc + t * v]))));
    return {
      answer: `1st octant: ${oct.map((q) => `(${xc + q[0]},${yc + q[1]})`).join(' ')} → ${all.size} pixels in total after 8-way symmetry`,
      steps: [
        `start (0, r) = (0, ${r}); p₀ = 5/4 − r = ${fmt(1.25 - r)} (integer version 1 − r = ${1 - r} gives the same pixels)`,
        'p < 0 → (x+1, y), p += 2x₊ + 1;  p ≥ 0 → (x+1, y−1), p += 2x₊ + 1 − 2y₊  (x₊, y₊ = the NEW x, y)',
        'Stop when x ≥ y. Mirror each (x, y) to (±x, ±y) and (±y, ±x)' + (xc || yc ? `, then add the centre (${xc},${yc}).` : '.'),
      ],
      table: { head: ['current', 'p', 'decision', 'next', 'new p'], rows },
      draw: { kind: 'circle', oct: oct.map(([a, b]) => [xc + a, yc + b]), all: [...all.values()], c: [xc, yc], r },
    };
  };

  E.barycentric = ({ A, B, C, P, vals }) => {
    const d = (B[1] - C[1]) * (A[0] - C[0]) + (C[0] - B[0]) * (A[1] - C[1]);
    if (!d) return { answer: 'Degenerate triangle (collinear vertices).', steps: [] };
    const al = ((B[1] - C[1]) * (P[0] - C[0]) + (C[0] - B[0]) * (P[1] - C[1])) / d;
    const be = ((C[1] - A[1]) * (P[0] - C[0]) + (A[0] - C[0]) * (P[1] - C[1])) / d;
    const ga = 1 - al - be, eps = 1e-9, inside = al >= -eps && be >= -eps && ga >= -eps;
    const onEdge = inside && (Math.abs(al) < eps || Math.abs(be) < eps || Math.abs(ga) < eps);
    const steps = [
      'U = αA + βB + γC with α + β + γ = 1 → three equations:',
      `x: ${P[0]} = ${A[0]}α + ${B[0]}β + ${C[0]}γ`,
      `y: ${P[1]} = ${A[1]}α + ${B[1]}β + ${C[1]}γ`,
      '1 = α + β + γ',
      `→ α = ${fmt(al)}, β = ${fmt(be)}, γ = ${fmt(ga)} (check: sum = ${fmt(al + be + ga)})`,
      inside ? (onEdge ? 'all ≥ 0 and one is 0 → ON AN EDGE (counts as inside)' : 'all > 0 → INSIDE') : 'a weight is negative → OUTSIDE',
    ];
    let answer = `α = ${fmt(al)}, β = ${fmt(be)}, γ = ${fmt(ga)} → ${inside ? 'inside' : 'outside'}`;
    let value = null;
    if (vals) {
      const comb = (fa, fb, fc) => al * fa + be * fb + ga * fc;
      if (Array.isArray(vals[0])) {
        value = vals[0].map((_, i) => comb(vals[0][i], vals[1][i], vals[2][i]));
        steps.push(`value = α·${vec(vals[0])} + β·${vec(vals[1])} + γ·${vec(vals[2])} = ${vec(value)}`);
        answer += ` · value = ${vec(value, 3)}`;
      } else {
        value = comb(...vals);
        steps.push(`value = ${fmt(al)}·${vals[0]} + ${fmt(be)}·${vals[1]} + ${fmt(ga)}·${vals[2]} = ${fmt(value)} ≈ ${roundHalfUp(value)}`);
        answer += ` · value = ${fmt(value)} ≈ ${roundHalfUp(value)}`;
      }
    }
    return { answer, steps, w: [al, be, ga], value, inside, draw: { kind: 'tri', A, B, C, P, inside } };
  };

  E.antialias = ({ x0, y0, x1, y1 }) => {
    if (x1 < x0) [x0, y0, x1, y1] = [x1, y1, x0, y0];
    const m = (y1 - y0) / (x1 - x0), rows = [], cells = [];
    for (let x = x0; x <= x1; x++) {
      const y = y0 + m * (x - x0), lo = Math.floor(y + 1e-9), f = y - lo;
      if (f < 1e-9) { rows.push([x, fmt(y), `(${x},${lo}) 100 %`, '—']); cells.push([x, lo, 1]); }
      else { rows.push([x, fmt(y), `(${x},${lo}) ${fmt((1 - f) * 100, 1)} %`, `(${x},${lo + 1}) ${fmt(f * 100, 1)} %`]); cells.push([x, lo, 1 - f], [x, lo + 1, f]); }
    }
    return {
      answer: `${cells.length} grey pixels; each column's intensities sum to 100 %`,
      steps: ['True line y = y₀ + m(x − x₀); in every column light the 2 pixels nearest the line.', 'intensity = 1 − distance to the line (closer = darker); the two always add up to 100 %.', 'If the line passes exactly through a pixel centre, light only that pixel.', 'Aliasing can be reduced, never removed. Other way: FSAA (render bigger, then average down).'],
      table: { head: ['x', 'true y', 'lower pixel', 'upper pixel'], rows },
      draw: { kind: 'aa', cells, a: [x0, y0], b: [x1, y1] },
    };
  };

  // grid: array of strings, first string = TOP row. '#' boundary, '.' empty, 'S' seed (optional)
  E.floodFill = ({ grid, seed, order = 'LRUD', conn = 4 }) => {
    const H = grid.length, cells = grid.map((r) => r.split(''));
    const at = (x, y) => (y >= 0 && y < H && x >= 0 && x < cells[H - 1 - y].length ? cells[H - 1 - y][x] : '#');
    if (!seed) { for (let yy = 0; yy < H; yy++) for (let xx = 0; xx < cells[H - 1 - yy].length; xx++) if (at(xx, yy) === 'S') seed = [xx, yy]; }
    if (!seed) return { answer: 'Mark a seed with S or type its coordinates.', steps: [] };
    const D = { L: [-1, 0], R: [1, 0], U: [0, 1], D: [0, -1] };
    let dirs = order.split('').map((c) => D[c]);
    if (conn === 8) dirs = dirs.concat([[-1, 1], [1, 1], [1, -1], [-1, -1]]);
    const seen = new Set(), seq = [];
    const fill = (x, y) => { // recursive, exactly like the lecture
      const k = x + ',' + y;
      if (seen.has(k) || at(x, y) === '#') return;
      seen.add(k); seq.push([x, y]);
      dirs.forEach(([dx, dy]) => fill(x + dx, y + dy));
    };
    if (at(seed[0], seed[1]) === '#') return { answer: `The seed (${seed[0]},${seed[1]}) is a border pixel: pick a seed inside the shape.`, steps: [] };
    fill(seed[0], seed[1]);
    return {
      answer: seq.map((q, i) => `${i + 1}:(${q[0]},${q[1]})`).join(' '),
      steps: [
        `Recursive ${conn}-connected flood fill from seed (${seed[0]},${seed[1]}), call order ${order.split('').map((c) => ({ L: 'left x−1', R: 'right x+1', U: 'up y+1', D: 'down y−1' })[c]).join(', ')}.`,
        'flood_fill(x,y): if pixel is not boundary and not filled → paint it, then call the 4 neighbours in that order (depth-first).',
        `${seq.length} pixels painted. Number them in this order on the grid. Say which seed and which order you used.`,
      ],
      draw: { kind: 'fill', grid, seq },
    };
  };

  // polygon scan-line fill. verts: [[x,y],...]
  E.scanline = ({ verts }) => {
    const n = verts.length, ys = verts.map((v) => v[1]);
    const yMin = Math.ceil(Math.min(...ys)), yMax = Math.floor(Math.max(...ys));
    const rows = [], spans = [];
    for (let y = yMax; y >= yMin; y--) {
      const xs = [];
      for (let i = 0; i < n; i++) {
        const [xa, ya] = verts[i], [xb, yb] = verts[(i + 1) % n];
        if (ya === yb) continue; // horizontal edges are drawn as contour, not counted
        const lo = Math.min(ya, yb), hi = Math.max(ya, yb);
        if (y >= lo && y < hi) xs.push(xa + (y - ya) * (xb - xa) / (yb - ya)); // half-open: lower end counts, upper end not
      }
      // peaks (local maxima) are counted twice by the lecture rule → single-pixel span
      verts.forEach(([vx, vy], i) => {
        if (vy !== y) return;
        const prev = verts[(i - 1 + n) % n], next = verts[(i + 1) % n];
        if (prev[1] < vy && next[1] < vy) xs.push(vx, vx);
      });
      xs.sort((a, b) => a - b);
      let sp = [];
      for (let k = 0; k + 1 < xs.length; k += 2) { const a = Math.ceil(xs[k] - 1e-9), b = Math.floor(xs[k + 1] + 1e-9); if (b >= a) sp.push([a, b]); }
      // horizontal edges lying on this row are contour: add them, then merge overlapping spans
      for (let i = 0; i < n; i++) { const [xa, ya] = verts[i], [xb, yb] = verts[(i + 1) % n]; if (ya === yb && ya === y) sp.push([Math.ceil(Math.min(xa, xb) - 1e-9), Math.floor(Math.max(xa, xb) + 1e-9)]); }
      sp.sort((p, q) => p[0] - q[0]);
      sp = sp.reduce((acc, s2) => { const l = acc[acc.length - 1]; if (l && s2[0] <= l[1] + 1) l[1] = Math.max(l[1], s2[1]); else acc.push(s2.slice()); return acc; }, []);
      spans.push([y, sp]);
      rows.push([y, xs.map((v) => fmt(v, 2)).join(', ') || '—', sp.map(([a, b]) => `${a}…${b}`).join(', ') || '—', sp.reduce((s, [a, b]) => s + b - a + 1, 0)]);
    }
    return {
      answer: `${rows.length} rows filled; total ${rows.reduce((s, r) => s + r[3], 0)} pixels`,
      steps: [
        '1. For each scan line (row y) find where it crosses the polygon edges: x = x₁ + (y − y₁)(x₂ − x₁)/(y₂ − y₁).',
        '2. Sort the crossings: x₁ ≤ x₂ ≤ x₃ ≤ …',
        '3. Fill between pairs: 1st–2nd, 3rd–4th, … (pixels from ceil(x_left) to floor(x_right)).',
        'Vertex rule (lecture): edges on opposite sides of the scan line → count the vertex once; both edges on the same side (peak/valley) → count it twice. Horizontal edges are not crossings (they are drawn as contour).',
      ],
      table: { head: ['row y', 'crossings x', 'fill', 'pixels'], rows },
      draw: { kind: 'scan', verts, spans },
    };
  };

  /* ================= Lecture 6: 2D transforms, frames ================= */
  const I3 = () => [[1, 0, 0], [0, 1, 0], [0, 0, 1]];
  const mul = (A, B) => A.map((r, i) => B[0].map((_, j) => r.reduce((s, _x, k) => s + A[i][k] * B[k][j], 0)));
  const apply = (M, p) => { const v = [p[0], p[1], 1]; const r = M.map((row) => row.reduce((s, x, j) => s + x * v[j], 0)); return [r[0] / r[2], r[1] / r[2]]; };
  const T = (dx, dy) => [[1, 0, dx], [0, 1, dy], [0, 0, 1]];
  const S = (sx, sy) => [[sx, 0, 0], [0, sy, 0], [0, 0, 1]];
  const R = (deg) => { const t = deg * Math.PI / 180, c = Math.cos(t), s = Math.sin(t); return [[c, -s, 0], [s, c, 0], [0, 0, 1]]; };
  const mstr = (M, d = 4) => '[' + M.map((r) => r.map((v) => fmt(v, d)).join(', ')).join(' ; ') + ']';
  E.mul = mul; E.apply = apply; E.T = T; E.S = S; E.R = R; E.mstr = mstr; E.I3 = I3;

  const opMatrix = (op) => {
    const about = op.about && (op.about[0] || op.about[1]) ? op.about : null;
    let M, name;
    if (op.type === 'T') { M = T(op.dx, op.dy); name = `T(${fmt(op.dx)}, ${fmt(op.dy)})`; }
    else if (op.type === 'S') { M = S(op.sx, op.sy); name = `S(${fmt(op.sx)}, ${fmt(op.sy)})`; }
    else if (op.type === 'R') { M = R(op.deg); name = `R(${fmt(op.deg)}°)`; }
    else if (op.type === 'Sh') { M = [[1, op.shx || 0, 0], [op.shy || 0, 1, 0], [0, 0, 1]]; name = `Shear(${fmt(op.shx || 0)}, ${fmt(op.shy || 0)})`; }
    else if (op.type === 'Mx') { M = S(1, -1); name = 'Mirror in the x-axis'; }
    else if (op.type === 'My') { M = S(-1, 1); name = 'Mirror in the y-axis'; }
    if (about && op.type !== 'T') { M = mul(T(about[0], about[1]), mul(M, T(-about[0], -about[1]))); name = `${name} about (${fmt(about[0])}, ${fmt(about[1])}) = T(${fmt(about[0])},${fmt(about[1])})·${name}·T(${fmt(-about[0])},${fmt(-about[1])})`; }
    return { M, name };
  };

  E.transform2D = ({ ops, points }) => {
    let M = I3(); const steps = [], names = [];
    ops.forEach((op, i) => { const { M: Mi, name } = opMatrix(op); names.push(name); steps.push(`${i + 1}. ${name} = ${mstr(Mi)}`); M = mul(Mi, M); });
    steps.push(`Composite (applied right-to-left): M = ${names.slice().reverse().map((n) => n.split(' about')[0]).join(' · ')} = ${mstr(M)}`);
    steps.push('Column vectors [x, y, 1]ᵀ: the FIRST transformation is the RIGHTMOST matrix. Order matters (T·R ≠ R·T).');
    const out = points.map((p) => apply(M, p));
    points.forEach((p, i) => steps.push(`M·[${fmt(p[0])}, ${fmt(p[1])}, 1]ᵀ = (${fmt(M[0][0])}·${fmt(p[0])} + ${fmt(M[0][1])}·${fmt(p[1])} + ${fmt(M[0][2])}, ${fmt(M[1][0])}·${fmt(p[0])} + ${fmt(M[1][1])}·${fmt(p[1])} + ${fmt(M[1][2])}) = ${pt(out[i])}`));
    return { answer: out.map((q) => pt(q, 3)).join(', '), M, out, steps, draw: { kind: 'poly2', before: points, after: out } };
  };

  E.frameChange = ({ P, E: Eo = [0, 0], deg = 0, u = null, v = null }) => {
    const t = deg * Math.PI / 180;
    const U = u || [Math.cos(t), Math.sin(t)], V = v || [-Math.sin(t), Math.cos(t)];
    const d = [P[0] - Eo[0], P[1] - Eo[1]];
    const pu = (d[0] * U[0] + d[1] * U[1]) / (U[0] ** 2 + U[1] ** 2), pv = (d[0] * V[0] + d[1] * V[1]) / (V[0] ** 2 + V[1] ** 2);
    return {
      answer: `(u, v) = (${fmt(pu)}, ${fmt(pv)})`,
      steps: [
        `Axes of the new frame (unit vectors, measured in OXY): u = ${vec(U)}, v = ${vec(V)}${u ? '' : ` (frame rotated ${fmt(deg)}° CCW)`}; origin E = ${pt(Eo)}`,
        `1. move to the new origin: P − E = ${vec(d)}`,
        `2. project on the axes: u = (P − E)·u = ${fmt(pu)}, v = (P − E)·v = ${fmt(pv)}`,
        `Matrix form: [u; v; 1] = [u_x u_y 0; v_x v_y 0; 0 0 1] · T(${fmt(-Eo[0])}, ${fmt(-Eo[1])}) · [x; y; 1] (rows = the new axes). Equivalently: rotate the POINT by −${fmt(deg)}°.`,
      ],
      draw: { kind: 'frame', P, E: Eo, U, V },
    };
  };

  /* ================= Lecture 6: clipping ================= */
  E.outcode = (x, y, w) => (y > w.ymax ? 8 : 0) | (y < w.ymin ? 4 : 0) | (x > w.xmax ? 2 : 0) | (x < w.xmin ? 1 : 0);
  const b4 = (c) => c.toString(2).padStart(4, '0');
  E.b4 = b4;
  E.cohenSutherland = ({ win, segs }) => {
    const w = { xmin: win[0], ymin: win[1], xmax: win[2], ymax: win[3] }, code = (x, y) => E.outcode(x, y, w);
    const res = [], blocks = [];
    segs.forEach((s, n) => {
      let [x0, y0, x1, y1] = s, c0 = code(x0, y0), c1 = code(x1, y1);
      const log = [`P1(${fmt(x0)},${fmt(y0)}) code ${b4(c0)}, P2(${fmt(x1)},${fmt(y1)}) code ${b4(c1)}; AND = ${b4(c0 & c1)}`];
      let out = null;
      for (let g = 0; g < 10; g++) {
        if (!(c0 | c1)) { out = [x0, y0, x1, y1]; log.push(`both 0000 → ACCEPT (${fmt(x0)},${fmt(y0)})–(${fmt(x1)},${fmt(y1)})`); break; }
        if (c0 & c1) { log.push(`AND = ${b4(c0 & c1)} ≠ 0000 → REJECT (whole segment outside on one side)`); break; }
        if (g === 0) log.push('AND = 0000 but not both 0000 → clip');
        const c = c0 || c1; let x, y, e;
        // lecture order (slide 14): left, top, right, bottom
        if (c & 1) { x = w.xmin; y = y0 + (y1 - y0) * (w.xmin - x0) / (x1 - x0); e = `left x = ${w.xmin}`; }
        else if (c & 8) { y = w.ymax; x = x0 + (x1 - x0) * (w.ymax - y0) / (y1 - y0); e = `top y = ${w.ymax}`; }
        else if (c & 2) { x = w.xmax; y = y0 + (y1 - y0) * (w.xmax - x0) / (x1 - x0); e = `right x = ${w.xmax}`; }
        else { y = w.ymin; x = x0 + (x1 - x0) * (w.ymin - y0) / (y1 - y0); e = `bottom y = ${w.ymin}`; }
        const form = (c & 12) ? `x = x₁ + (x₂−x₁)(y−y₁)/(y₂−y₁)` : `y = y₁ + (y₂−y₁)(x−x₁)/(x₂−x₁)`;
        if (c === c0) { log.push(`clip P1 against ${e}: ${form} → (${fmt(x)},${fmt(y)}), new code ${b4(code(x, y))}`); x0 = x; y0 = y; c0 = code(x, y); }
        else { log.push(`clip P2 against ${e}: ${form} → (${fmt(x)},${fmt(y)}), new code ${b4(code(x, y))}`); x1 = x; y1 = y; c1 = code(x, y); }
        log.push(`new AND = ${b4(c0 & c1)}`);
      }
      res.push(out); blocks.push({ title: `Segment ${n + 1}: (${s[0]},${s[1]})–(${s[2]},${s[3]})`, log, out });
    });
    return {
      answer: blocks.map((b, i) => `#${i + 1} ${b.out ? `kept (${fmt(b.out[0], 2)},${fmt(b.out[1], 2)})–(${fmt(b.out[2], 2)},${fmt(b.out[3], 2)})` : 'rejected'}`).join(' · '),
      steps: ['Outcode bits [Top Bottom Right Left] (slide: 1001 = top-left, 0110 = bottom-right).', 'Both 0000 → accept. AND ≠ 0000 → reject. Otherwise cut the outside end on one window edge (lecture order: left, top, right, bottom), recompute its code, repeat.'],
      blocks,
      draw: { kind: 'clip', win, segs, res },
    };
  };

  E.sutherlandHodgman = ({ poly, win, order = ['left', 'top', 'right', 'bottom'] }) => {
    const [xmin, ymin, xmax, ymax] = win;
    const E4 = {
      left: { inside: (p) => p[0] >= xmin, cut: (a, b) => [xmin, a[1] + (b[1] - a[1]) * (xmin - a[0]) / (b[0] - a[0])], name: `left x = ${xmin}` },
      right: { inside: (p) => p[0] <= xmax, cut: (a, b) => [xmax, a[1] + (b[1] - a[1]) * (xmax - a[0]) / (b[0] - a[0])], name: `right x = ${xmax}` },
      bottom: { inside: (p) => p[1] >= ymin, cut: (a, b) => [a[0] + (b[0] - a[0]) * (ymin - a[1]) / (b[1] - a[1]), ymin], name: `bottom y = ${ymin}` },
      top: { inside: (p) => p[1] <= ymax, cut: (a, b) => [a[0] + (b[0] - a[0]) * (ymax - a[1]) / (b[1] - a[1]), ymax], name: `top y = ${ymax}` },
    };
    let list = poly.slice(); const stages = [];
    order.forEach((k) => {
      const e = E4[k], out = [], log = [];
      for (let i = 0; i < list.length; i++) {
        const S0 = list[(i - 1 + list.length) % list.length], W = list[i], si = e.inside(S0), wi = e.inside(W);
        const edge = `${pt(S0, 2)}→${pt(W, 2)}`;
        if (si && wi) { out.push(W); log.push(`${edge}: in → in, output W ${pt(W, 2)}`); }
        else if (si && !wi) { const P = e.cut(S0, W); out.push(P); log.push(`${edge}: in → out, output crossing P ${pt(P, 2)}`); }
        else if (!si && wi) { const P = e.cut(S0, W); out.push(P, W); log.push(`${edge}: out → in, output P ${pt(P, 2)} and W ${pt(W, 2)}`); }
        else log.push(`${edge}: out → out, output nothing`);
      }
      stages.push({ title: `Clip against ${e.name}`, log, result: out.slice() });
      list = out;
    });
    return {
      answer: list.map((p) => pt(p, 2)).join(', ') || 'empty (polygon fully outside)',
      steps: ['Clip against one window edge at a time (slide 17 example: left first, then top; here left, top, right, bottom). The output list of one stage is the input of the next. The slide walks the polygon edges clockwise.', 'Four cases per polygon edge S→W: in→in: W · in→out: P · out→in: P, W · out→out: nothing.'],
      stages,
      draw: { kind: 'sh', poly, win, out: list },
    };
  };

  /* ================= Lecture 6: Bézier ================= */
  const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
  E.deCasteljau = (pts, t) => { const L = [pts]; while (L[L.length - 1].length > 1) { const p = L[L.length - 1]; L.push(p.slice(1).map((q, i) => lerp(p[i], q, t))); } return L; };
  const binom = (n, k) => { let r = 1; for (let i = 1; i <= k; i++) r = r * (n - k + i) / i; return r; };
  E.bezier = ({ pts, ts = [0.25, 0.5, 0.75] }) => {
    const n = pts.length - 1, steps = [];
    steps.push(`Degree ${n} (${n === 2 ? 'quadratic = second order, 3 points' : n === 3 ? 'cubic = third order, 4 points' : (n + 1) + ' points'}). The curve starts at P0, ends at P${n}, and is pulled toward (but does not pass through) the inner control points.`);
    steps.push('Construction for a given t: on every segment of the control polygon mark the point at fraction t; join the new points and repeat until one point is left = B(t).');
    const rows = [];
    ts.forEach((t) => {
      const L = E.deCasteljau(pts, t);
      L.slice(1).forEach((lv, k) => steps.push(`t = ${t}, round ${k + 1}: ${lv.map((p) => pt(p, 4)).join(' ')}`));
      const bern = Array.from({ length: n + 1 }, (_, i) => binom(n, i) * (1 - t) ** (n - i) * t ** i);
      rows.push([t, pt(L[L.length - 1][0], 4), bern.map((b) => fmt(b, 4)).join(', ')]);
    });
    const last = pts[n], prev = pts[n - 1];
    const c1 = [2 * last[0] - prev[0], 2 * last[1] - prev[1]];
    steps.push(n === 2 ? 'Formula: B(t) = (1−t)²P0 + 2t(1−t)P1 + t²P2' : n === 3 ? 'Formula: B(t) = (1−t)³P0 + 3t(1−t)²P1 + 3t²(1−t)P2 + t³P3' : 'B(t) = Σ C(n,i) tⁱ(1−t)ⁿ⁻ⁱ Pᵢ');
    steps.push(`Smooth joining of a next curve Q: Q0 = P${n} ${pt(last)} (C0, continuous), and Q1 on the line P${n - 1}P${n} beyond P${n} (G1, same tangent direction). Equal length too (C1): Q1 = 2P${n} − P${n - 1} = ${pt(c1)}.`);
    return { answer: rows.map((r) => `t=${r[0]} → ${r[1]}`).join(' · '), steps, table: { head: ['t', 'B(t)', 'Bernstein weights'], rows }, c1, draw: { kind: 'bez', pts, ts } };
  };

  root.GRK = E;
  if (typeof module !== 'undefined') module.exports = E;
})(typeof window !== 'undefined' ? window : globalThis);
</script>

    videos: [['How do Video Game Graphics Work?', 'Branch Education', 'https://www.youtube.com/watch?v=C8YtdC8mxTU', '21:00'], ['Triangles to Pixels', 'Computerphile', 'https://www.youtube.com/watch?v=aweqeMxDnu4', '8:16'], ['Vertex and Fragment Shaders', 'Udacity', 'https://www.youtube.com/watch?v=C1ZUeHLb0YU', '1:35']],

    videos: [['Resizing Images', 'Computerphile', 'https://www.youtube.com/watch?v=AqscP7rc8_M', '9:21'], ['What is "Retina"? PPI', 'Techquickie', 'https://www.youtube.com/watch?v=Zl5cN8Z7LnM', '3:23'], ['Digital Images', 'Computerphile', 'https://www.youtube.com/watch?v=06OHflWNCOE', '8:15']],
    img: 'bilinear' },
  { id: 'col', lec: 'L3', name: 'Colour models', colour: 'r',

  { t: 'img', q: 'Nearest-neighbour vs bilinear when enlarging?', a: 'Nearest copies the closest old pixel (blocky, fast). Bilinear blends the 4 nearest old pixels by distance (smooth, slightly blurry).' },

  { t: 'col', q: 'In the HSV cone, where are greys? Where is black?', a: 'Greys on the central vertical axis (S = 0). Black at the tip (V = 0). White at the centre of the top disc.', img: 'hsvcone' },

  { t: 'col', q: '8-bit value 200 at 3 bits?', a: 'floor(200/32) = 6 (range 0–7).' },
  { t: 'col', q: 'Why reduce depth with floor(v / 2^(8−n))?', a: 'It drops the lowest 8−n bits (a right shift): 0–255 maps onto 0–(2ⁿ−1) in equal-width bins.' },
  { t: 'line', q: 'Bresenham: p₀ for (0,0)→(6,4)?', a: 'Δx = 6, Δy = 4 → p₀ = 2·4 − 6 = 2 (a = 8, b = −4).' },
  { t: 'line', q: 'Bresenham: what do you do when p = 0?', a: 'p ≥ 0 → go up (x+1, y+1), p += b.', img: 'bres' },
  { t: 'line', q: 'Why is the Bresenham decision value p = Δx·(d₁ − d₂)?', a: 'd₁ − d₂ contains the fraction m = Δy/Δx. Multiplying by Δx (> 0) keeps the sign and leaves only integers, so p₀ = 2Δy − Δx and every step is one integer addition.' },

  { t: 'line', q: 'Antialiased line: true y = 1.3 in a column. Intensities?', a: 'Pixel y=1: 70 %, pixel y=2: 30 % (closer = stronger, sum 100 %).', img: 'aa' },
